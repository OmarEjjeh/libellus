      ut valet, pio reddit afféctu; tibi sit honor, qui trinus et unus
      vivis et regnas.
    de: >-  # TODO: AI draft, not yet reviewed
      Demütig vertraue ich dir Seele und Leib an; in deiner Güte mögest
