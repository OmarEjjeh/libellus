# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 1
verses:
  1: Glückselig der Mann, der nicht wandelt nach dem Rate der Bösen und auf dem Wege
    der Sünder nicht steht und nicht sitzt auf dem Stuhle des Verderbens,
  2: sondern der am Gesetze des Herrn seine Lust hat und das Gesetz desselben betrachtet
    Tag und Nacht!
  3: Er ist wie ein Baum, der gepflanzt ist an Wasserbächen, der seine Frucht bringt
    zu seiner Zeit.
  4: Und dessen Laub nicht abfällt, und alles, was er tut, gelingt ihm wohl.
  5: Nicht also die Gottlosen, nicht also; sondern sie sind wie Staub, den der Wind
    von der Erde aufweht.
  6: Darum werden die Gottlosen im Gerichte nicht bestehen und die Sünder nicht in
    der Gemeinde der Gerechten.
  7: Denn der Herr kennt den Weg der Gerechten und der Pfad der Gottlosen führt ins
    Verderben.
  8: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  9: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
