# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 100
verses:
  1: Von Erbarmen und Recht will ich dir singen, o Herr! will dir lobsingen.
  2: Ich will mich einsichtig zeigen durch unbefleckten Wandel, wenn du zu mir kommst.
  3: Ich will wandeln in der Unschuld meines Herzens inmitten meines Hauses.
  4: Nicht will ich Unrecht vor meine Augen stellen, die, welche Böses tun, will ich
    hassen.
  5: Es soll mir nicht anhängen ein verkehrtes Herz, den Bösen, der sich von mir abwendet,
    will ich nicht kennen.
  6: Wer insgeheim seinen Nächsten verleumdet, den will ich verfolgen;
  7: Wessen Auge stolz ist und wessen Herz unersättlich, mit dem will ich nicht zusammen
    essen!
  8: Meine Augen sind auf die Treuen im Lande gerichtet, dass sie bei mir wohnen;
    wer auf makellosem Wege wandelt, soll mir dienen.
  9: Nicht soll in meinem Hause wohnen, wer Hochmut übt; wer Unrecht redet, soll nicht
    bestehen vor meinen Augen.
  10: Am Morgen will ich alle Frevler im Lande töten, um auszurotten aus der Stadt
    des Herrn alle Übeltäter.
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
