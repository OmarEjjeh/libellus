# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 103
verses:
  1: Preise, meine Seele, den Herrn! Herr, mein Gott! du bist überaus groß,
  2: mit Lobpreis und Pracht bist du angetan, bist mit Licht umhüllt wie mit einem
    Gewande.
  3: Du spannst den Himmel aus wie eine Decke; der du seine höchste Höhe mit Wassern
    bedeckst,
  4: der du die Wolken zu deinem Wagen machst, der du einherfährst auf den Flügeln
    der Winde;
  5: der du Winde zu deinen Boten machst und Feuerflammen zu deinen Dienern!
  6: der du die Erde auf ihre Grundfeste gegründet hast, dass sie in Ewigkeit nicht
    wanke.
  7: Wasserflut bedeckte sie wie ein Gewand, auf den Bergen standen Gewässer.
  8: Vor deinem Schelten fliehen sie, vor deines Donners Stimme erschrecken sie.
  9: Die Berge steigen empor und die Täler senken sich an dem Ort, den du für sie
    gegründet.
  10: Du setztest eine Grenze, die sie nicht überschreiten dürfen, und sie werden
    nicht wiederum die Erde bedecken.
  11: Der du Quellen in den Tälern hervorsprudeln lässest, dass zwischen den Bergen
    die Wasser dahinfließen.
  12: Es trinken daraus alle Tiere des Feldes, es verlangen in ihrem Durste die Waldesel
    darnach.
  13: Über ihnen wohnen die Vögel des Himmels, aus Felsengeklüft lassen sie ihre Stimmen
    hören.
  14: Du lässest Regen auf die Berge fallen aus höchsten Höhen, von der Frucht deiner
    Werke sättigt sich die Erde.
  15: Du lässest Gras wachsen für das Vieh und Pflanzen zum Dienste der Menschen,
  16: dass du aus der Erde Brot hervorbringest und dass der Wein des Menschen Herz
    erfreue,
  17: das Öl sein Antlitz erfrische und das Brot des Menschen Herz stärke.
  18: Die Bäume des Feldes werden satt und die Zedern des Libanon, die er gepflanzt,
    dort nisten Sperlinge,
  19: welchen das Haus der Reiher vorangeht. Die hohen Berge sind der Hirsche, die
    Felsen der Igel Zuflucht.
  20: Er hat den Mond gemacht zur Unterscheidung der Zeiten, die Sonne kennt ihren
    Niedergang.
  21: Du setzest Finsternis und es wird Nacht, in ihr regen sich alle Tiere des Waldes.
  22: Die jungen Löwen brüllen nach Raub und heischen ihre Speise von Gott.
  23: Wenn die Sonne aufgeht, sammeln sie sich und legen sich auf ihre Lager nieder.
  24: Der Mensch geht aus an sein Werk und an seine Arbeit bis zum Abend.
  25: Wie groß sind deine Werke, o Herr! du hast sie alle mit Weisheit geschaffen;
    was die Erde erfüllt, ist dein.
  26: Da ist das Meer, groß und weithin greifend, darin ist Tiergewimmel ohne Zahl,
  27: Tiere, kleine wie große. Dort ziehen die Schiffe dahin,
  28: das Meerungeheuer, welches du gemacht, dass es darin spiele. Sie alle warten
    auf dich, dass du ihnen Speise gebest zu rechter Zeit.
  29: Du gibst ihnen und sie lesen auf, du tust deine Hand auf und alles sättigt sich
    mit Gutem.
  30: Wendest du aber dein Angesicht weg, so befällt sie Schrecken; nimmst du ihren
    Odem weg, so vergehen sie und werden wieder zu Staub.
  31: Entsendest du deinen Geist, so werden sie geschaffen, und du erneuerst das Angesicht
    der Erde.
  32: Ehre sei dem Herrn in Ewigkeit! der Herr freut sich seiner Werke;
  33: der die Erde ansieht und macht, dass sie erzittert; der die Berge berührt, dass
    sie rauchen.
  34: Ich will den Herrn preisen mein Leben lang, will meinem Gott lobsingen, so lange
    ich bin.
  35: Möge ihm meine Rede wohlgefallen, ich will mich freuen in dem Herrn.
  36: Mögen die Sünder von der Erde verschwinden und die Gottlosen, so dass sie nicht
    mehr sind; preise, meine Seele, den Herrn!
  37: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  38: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
