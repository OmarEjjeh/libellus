# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 104
verses:
  1: Preiset den Herrn und rufet seinen Namen an, machet unter den Völkern seine Taten
    kund.
  2: Singet ihm, spielet ihm, erzählet alle seine Wunder!
  3: Rühmet euch seines heiligen Namens, es freue sich das Herz derer, die den Herrn
    suchen!
  4: Suchet den Herrn und seid stark, suchet sein Angesicht allezeit!
  5: Gedenket seiner Wunder, die er getan, seiner Zeichen und der Gerichte seines
    Mundes!
  6: Ihr, die Nachkommen Abrahams, seine Diener, ihr, Söhne Jakobs, seine Auserwählten!
  7: Er, der Herr, ist unser Gott; über die ganze Erde erstrecken sich seine Gerichte.
  8: Er gedenkt ewig seines Bundes, der Verheißung, die er auf tausend Geschlechter
    hin gegeben,
  9: welchen er mit Abraham geschlossen, und seines Eidschwures an Isaak.
  10: Und er stellte ihn für Jakob zum Gesetze hin und für Israel zum ewigen Bunde,
  11: 'indem er sprach: Dir will ich das Land Kanaan geben als euch zugemessenes Erbe.'
  12: Als sie noch gering waren an Zahl, sehr wenige und Fremdlinge daselbst.
  13: Sie zogen von Volk zu Volk und von einem Reiche zu einem andern Volke.
  14: 'Er gestattete niemand, ihnen Schaden zu tun und strafte um ihretwillen Könige:'
  15: Tastet nicht an meine Gesalbten und tuet meinen Propheten kein Leid!
  16: Und er rief eine Hungersnot über das Land und zerbrach jegliche Stütze an Brot.
  17: Er sandte einen Mann vor ihnen her, zum Knechte ward Joseph verkauft.
  18: Sie zwängten seine Füße in Fesseln, Eisen durchdrang seine Seele, bis sein Wort
    eintraf.
  19: Des Herrn Rede bewährte ihn. Da sandte der König hin und löste ihn, der Völkerbeherrscher
    gab ihn frei.
  20: Er setzte ihn zum Gebieter über sein Haus ein und zum Herrscher über all seinen
    Besitz,
  21: dass er seine Fürsten leitete wie sich selbst und seine Ältesten Klugheit lehrte.
  22: Und Israel kam nach Ägypten, Jakob weilte als ein Fremdling im Lande Chams.
  23: Und er mehrte sein Volk überaus und machte es stärker als seine Feinde.
  24: Er wandelte deren Herz, dass sie sein Volk hassten und List übten wider seine
    Diener.
  25: Er sandte Moses, seinen Diener, Aaron, den er auserwählt hatte.
  26: Er verrichtete an ihnen seine Zeichen und Wunder im Lande Chams.
  27: Er sandte Finsternis und führte Dunkelheit herauf und nicht ward seinen Befehlen
    Widerstand geleistet.
  28: Er wandelte ihre Wasser in Blut und ließ ihre Fische sterben.
  29: Ihr Land brachte Frösche hervor bis in die Gemächer ihrer Könige.
  30: Er sprach, da kam die Hundsfliege, Stechmücken in ihr ganzes Gebiet.
  31: Er gab ihnen Hagel als Regen, sandte verzehrendes Feuer in ihr Land.
  32: Und er schlug ihre Weinberge und ihre Feigenbäume und zerbrach die Bäume in
    ihrem ganzen Lande.
  33: Er gebot, da kamen Heuschrecken aller Art, unzählbar an Menge.
  34: Diese fraßen alles Grün in ihrem Lande und fraßen alle Frucht ihres Feldes.
  35: Er schlug alle Erstgeburt in ihrem Lande, die Erstlinge aller ihrer Muttermühen.
  36: Er führte sie heraus mit Silber und Gold und kein Schwacher war in ihren Stämmen.
  37: Es freute sich Ägypten über ihren Auszug, denn Schrecken vor jenen hatte sie
    befallen.
  38: Er breitete eine Wolke zu ihrem Schirme aus und Feuer, ihnen in der Nacht zu
    leuchten.
  39: Sie verlangten, da kamen die Wachteln, und er sättigte sie mit Himmelsbrot.
  40: Er spaltete den Felsen und es floss Wasser heraus, floss fort als Strom in dürrem
    Lande.
  41: Denn er gedachte seines heiligen Wortes, das er zu Abraham, seinem Diener, gesprochen.
  42: So führte er sein Volk aus unter Jubel und seine Auserwählten in Freuden.
  43: Und er gab ihnen die Länder der Völker zum Besitz und die Arbeiten der Nationen
    ererbten sie,
  44: auf dass sie seine Gebote bewahrten und seine Satzungen befolgten.
  45: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  46: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
