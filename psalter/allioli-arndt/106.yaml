# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 106
verses:
  1: Lobsinget dem Herrn, denn er ist gütig, denn seine Gnade währt in Ewigkeit!
  2: So sollen die von dem Herrn Erlösten sprechen, die er aus der Hand des Feindes
    erlöst und aus den Ländern gesammelt hat,
  3: vom Aufgang und vom Niedergang der Sonne, von Mitternacht her und vom Meer.
  4: Sie gingen irre in wasserloser Öde, den Weg zu einer bewohnbaren Stadt fanden
    sie nicht.
  5: Sie litten Hunger und Durst und ihre Seele verschmachtete in ihnen.
  6: Da riefen sie zum Herrn in ihrer Not und er rettete sie aus ihren Ängsten
  7: und führte sie auf rechtem Wege, dass sie zu einer Stadt gelangten, wo sie wohnen
    konnten.
  8: Sie mögen den Herrn preisen für seine Erbarmungen und für seine Wunder an den
    Menschenkindern,
  9: dass er die lechzende Seele gesättigt, die hungernde Seele mit Gütern erfüllt
    hat.
  10: Sie saßen in Finsternis und Todesschatten, in Elend und Eisen gefangen,
  11: weil sie Gottes Worten widerstrebt und den Ratschluss des Allerhöchsten verworfen
    hatten.
  12: Und ihr Herz ward gebeugt durch Mühsal, sie wurden kraftlos und niemand half.
  13: Da riefen sie zu dem Herrn in ihrer Not und er rettete sie aus ihren Ängsten.
  14: Er führte sie heraus aus Finsternis und Todesschatten und brach ihre Fesseln.
  15: Sie mögen den Herrn preisen für seine Erbarmungen und für seine Wunder an den
    Menschenkindern,
  16: denn er zerbrach die ehernen Tore und zerschlug die eisernen Riegel.
  17: Er nahm sie auf vom Wege ihrer Sünde, denn um ihrer Missetaten willen waren
    sie gedemütigt.
  18: Jegliche Speise verabscheute ihre Seele und sie waren schon nahe den Pforten
    des Todes.
  19: Da riefen sie zum Herrn in ihrer Not und er rettete sie aus ihren Ängsten.
  20: Er entsandte sein Wort und heilte sie und entriss sie ihrem Untergange.
  21: Sie mögen den Herrn preisen für seine Erbarmungen und für seine Wunder an den
    Menschenkindern
  22: und mögen Lobopfer darbringen und seine Werke mit Frohlocken verkünden.
  23: Die auf Schiffen das Meer befuhren, auf großen Wassern Handel trieben,
  24: sie schauten die Werke des Herrn und seine Wunder in der Tiefe.
  25: Er gebot und ein Sturmwind erhob sich und seine Fluten türmten sich auf.
  26: Sie stiegen bis zum Himmel empor und sanken hinab bis in den Abgrund, ihre Seele
    verzagte im Unglück.
  27: Sie taumelten und wankten gleich Trunkenen und all ihre Weisheit war verschlungen.
  28: Da riefen sie zu dem Herrn in ihrer Not und er half ihnen aus ihren Ängsten.
  29: Er wandelte den Sturmwind in sanftes Säuseln und seine Wellen wurden still.
  30: Da freuten sie sich, dass jene sich legten, und er führte sie zum Hafen ihrer
    Sehnsucht.
  31: Sie mögen den Herrn preisen für seine Erbarmungen und für seine Wunder an den
    Menschenkindern
  32: und ihn hocherheben in der Versammlung des Volkes und im Rate der Ältesten ihn
    loben!
  33: Er wandelte Ströme zu Wüsten und Wasserquellen in durstiges Land,
  34: fruchtbares Land zur salzigen Steppe um der Bosheit der Bewohner willen.
  35: Er machte die Wüste zu Wasserseen und dürres Land zu Quellorten.
  36: Und er ließ dort die Hungrigen wohnen und sie gründeten sich eine Stadt zum
    Wohnsitze.
  37: Sie besäten Felder und pflanzten Weinberge und gewannen die Frucht des Ertrages.
  38: Und er segnete sie, dass sie sich überaus vermehrten, und er gab ihnen Vieh
    in nicht geringer Menge.
  39: Sie wurden wenige und durch Drangsal des Unglücks und Schmerz heimgesucht.
  40: Verachtung ward über die Fürsten ausgegossen und er ließ sie in unwegsamer Öde
    ohne Pfad dahinirren.
  41: Doch er half dem Armen aus dem Elende und machte die Geschlechter Schafherden
    gleich.
  42: Es sehen dies die Redlichen und freuen sich und alle Bosheit verschließt ihren
    Mund.
  43: Wer ist weise und beachtet dies und versteht die Erbarmungen des Herrn?
  44: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  45: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
