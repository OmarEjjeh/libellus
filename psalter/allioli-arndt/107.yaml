# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 107
verses:
  1: Bereit ist mein Herz, o Gott! bereit ist mein Herz; ich will singen und spielen
    in meiner Ehre.
  2: 'Auf, meine Ehre, auf, Harfe und Zither: Ich will mich erheben am frühen Morgen!'
  3: Ich will dich preisen unter den Völkern! o Herr! dir lobsingen unter den Nationen,
  4: Denn groß über die Himmel hinaus ist dein Erbarmen und bis an die Wolken reicht
    deine Treue.
  5: Erhebe dich über die Himmel, o Gott! über die ganze Erde zeige sich deine Herrlichkeit,
    dass errettet werden deine Geliebten.
  6: 'So hilf nun mit deiner Rechten und erhöre mich! Gott sprach in seinem Heiligtume:'
  7: Ich will frohlocken, ich will Sichem teilen und das Tal der Zelte vermessen.
  8: Mein ist Galaad und mein ist Manasses und Ephraim ist meines Hauptes Schutzwehr,
  9: Juda mein König, Moab ist mein erwünschtes Becken.
  10: Über Edom strecke ich meinen Schuh, die Fremdlinge wurden meine Freunde.
  11: Wer wird mich in die feste Stadt führen? Wer mich bis nach Edom geleiten?
  12: Nicht du, o Gott! der du uns verstoßen hast? Wirst du nicht, o Gott! mit unsern
    Heeren ausziehen?
  13: Schaffe uns Rettung aus der Drangsal, denn nichtig ist der Menschen Hilfe.
  14: In Gott werden wir Großes vollbringen und er wird unsere Feinde zunichte machen.
  15: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  16: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
