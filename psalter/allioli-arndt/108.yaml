# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 108
verses:
  1: O Gott! verschweige nicht mein Lob; denn der Mund des Sünders, der Mund des Arglistigen
    ist über mich aufgetan.
  2: Sie reden wider mich mit arglistiger Zunge und umgeben mich mit Worten des Hasses
    und befeinden mich ohne Ursache.
  3: Statt mich zu lieben, verleumden sie mich, ich aber bete fort und fort!
  4: Sie vergelten mir Böses für Gutes und Hass für meine Liebe.
  5: Bestelle über ihn einen Frevler und der Ankläger stehe zu seiner Rechten!
  6: Wenn er gerichtet wird, gehe er als schuldig davon und sein Gebet werde zur Sünde.
  7: Seiner Tage seien wenige und sein Amt erhalte ein anderer!
  8: Seine Kinder sollen zu Waisen werden und sein Weib zur Witwe.
  9: Unstet mögen seine Kinder umherirren und betteln gehen und hinausgestoßen werden
    aus ihren Wohnungen.
  10: Der Wucherer spüre alle seine Habe auf und Fremde mögen rauben, was er mühsam
    erworben.
  11: Niemand komme ihm zu Hilfe und keiner erbarme sich seiner Waisen.
  12: Seine Nachkommenschaft werde ausgerottet, im ersten Geschlechte erlösche sein
    Name.
  13: Der Schuld seiner Väter werde vor dem Herrn gedacht und die Versündigung seiner
    Mutter werde nicht ausgetilgt.
  14: Sie seien vor dem Herrn immerdar und ihr Andenken verschwinde von der Erde;
    weil er nicht gedachte, Barmherzigkeit zu üben,
  15: sondern den Armen verfolgte und den Dürftigen, der zerschlagenen Herzens war,
    um ihn zu töten.
  16: Er liebte den Fluch, so komme er über ihn; Segen mochte er nicht, nun bleibe
    er fern von ihm!
  17: Er zog den Fluch an wie ein Kleid und er drang wie Wasser in sein Inneres, wie
    Öl in sein Gebein.
  18: Er werde ihm wie ein Kleid, das ihn bedeckt, und wie ein Gürtel, der ihn stets
    umschlingt.
  19: Dies sei der Lohn für meine Verleumder von dem Herrn, für die, welche Böses
    wider meine Seele reden!
  20: Du aber, Herr, Herr! tue Gutes an mir um deines Namens willen, denn lieblich
    ist deine Barmherzigkeit. Errette mich,
  21: denn ich bin elend und arm und mein Herz ist betrübt in mir.
  22: Wie ein Schatten, der sich neigt, werde ich hingerafft und werde verscheucht
    wie eine Heuschrecke.
  23: Meine Knie werden kraftlos vom Fasten, und mein Fleisch zehrt ab aus Mangel
    an Öl.
  24: Ich bin ihnen zum Hohn geworden, sie sehen mich und schütteln ihr Haupt.
  25: Hilf mir, o Herr, mein Gott! errette mich nach deiner Barmherzigkeit
  26: und lass sie erkennen, dass deine Hand dies ist, und du, Herr! es getan hast.
  27: Mögen sie fluchen, du aber segne; die wider mich aufstehen, mögen beschämt werden,
    dein Diener aber möge sich freuen dürfen.
  28: Mit Schande mögen bedeckt werden, die mich verleumden, wie mit einem Mantel
    von ihrer Schmach umhüllt werden.
  29: Ich will den Herrn hochpreisen mit meinem Munde und inmitten vieler ihn loben.
  30: Denn er steht dem Armen zur Rechten, meine Seele von ihren Verfolgern zu erretten.
  31: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  32: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
