psalmus: 118
verses:
  1: Glückselig, deren Weg makellos, die nach dem Gesetze des Herrn wandeln!
  2: Glückselig, die seine Zeugnisse durchforschen, ihn von ganzem Herzen suchen.
  3: Denn die, welche Unrecht tun, wandeln nicht auf seinen Wegen.
  4: Du hast anbefohlen, deine Gebote strenge zu halten.
  5: O möchten meine Wege darauf hingerichtet sein, deine Satzungen zu bewahren!
  6: Dann werde ich nicht zuschanden, wenn ich auf alle deine Gebote blicke.
  7: Ich will dich mit redlichem Herzen preisen, weil ich die Rechte deiner Gerechtigkeit
    gelernt.
  8: Deine Satzungen will ich halten, verlass mich nicht gänzlich. Beth.
  9: Wodurch kann ein Jüngling seinen Wandel gerade erhalten? Indem er deine Worte
    befolgt.
  10: Mit meinem ganzen Herzen suche ich dich, lass mich nicht abirren von deinen
    Geboten!
  11: Tief in meinem Herzen bewahre ich deine Aussprüche, damit ich nicht wider dich
    sündige.
  12: Gepriesen seist du, Herr! lehre mich deine Satzungen.
  13: Mit meinen Lippen mache ich alle Rechte deines Mundes kund.
  14: An dem Wege deiner Zeugnisse habe ich Freude wie an reichen Schätzen.
  15: Deine Gebote will ich eifrig betrachten und deinen Wegen nachsinnen.
  16: Deine Satzungen will ich betrachten, deine Worte nimmermehr vergessen. Gimel.
  17: Erweise deinem Diener Gutes und erhalte mich am Leben, so will ich deine Worte
    bewahren.
  18: Öffne meine Augen, dass ich die Wunder deines Gesetzes schaue.
  19: Ein Fremdling bin ich auf Erden, verbirg deine Gebote nicht vor mir!
  20: Es verzehrt sich meine Seele im Verlangen nach deinen Satzungen allezeit.
  21: Du bedrohest die Stolzen; verflucht sind, die von deinen Geboten abweichen.
  22: Nimm weg von mir Schmach und Verachtung, denn deine Zeugnisse suche ich.
  23: Ob auch Fürsten sich setzen, wider mich zu reden, so sinnt dein Diener doch
    in deinen Satzungen;
  24: denn deine Zeugnisse sind meine Betrachtung und deine Satzungen meine Ratgeber.
    Daleth.
  25: Es klebt am Boden meine Seele, belebe mich nach deinem Worte.
  26: Ich tat meine Wege kund und du erhörtest mich, lehre mich deine Satzungen.
  27: Lass mich den Weg deiner Satzungen verstehen, so will ich über deine Wunder
    nachsinnen.
  28: Meine Seele ist ermattet vor Überdruss, stärke mich durch deine Worte.
  29: Den Weg des Unrechtes halte fern von mir und mit deinem Gesetze begnadige mich.
  30: Den Weg der Wahrheit habe ich erwählt, deine Rechte nicht vergessen.
  31: Ich hänge an deinen Zeugnissen, Herr! lass mich nicht zuschanden werden.
  32: Den Weg deiner Gebote will ich laufen, wenn du mir das Herz weit gemacht. He.
  33: Mache mir, Herr! den Weg deiner Satzungen zum Gesetze, so will ich ihn allezeit
    suchen.
  34: Gib mir Einsicht, so will ich in deinem Gesetze forschen und es von ganzem Herzen
    beobachten.
  35: Leite mich auf dem Pfade deiner Gebote, denn nach diesem verlange ich.
  36: Neige mein Herz deinen Zeugnissen zu und nicht der Habsucht.
  37: Wende meine Augen ab, dass sie nicht nach Eitlem schauen, belebe mich auf deinem
    Wege!
  38: Bestätige deinem Diener deine Verheißung ob der Furcht vor dir.
  39: Nimm weg von mir die Schmach, vor der ich mich fürchte, denn deine Rechte sind
    süß.
  40: Siehe, mich verlangt nach deinen Geboten, belebe mich durch deine Gerechtigkeit!
    Vau.
  41: Deine Gnade komme über mich, Herr! dein Heil nach deiner Verheißung.
  42: So will ich Rede stehen denen, die mich höhnen; denn ich hoffe auf deine Worte.
  43: Entziehe nicht ganz meinem Munde das Wort der Wahrheit, denn auf deine Gerichte
    setze ich alle meine Hoffnung.
  44: Und ich will dein Gesetz allewege halten, immerdar und ewig.
  45: Ich will wandeln auf freier Bahn, denn deine Gebote habe ich gesucht.
  46: Und ich will von deinen Zeugnissen vor Königen reden und mich nicht schämen.
  47: Und will deine Gebote betrachten, die ich liebe,
  48: und meine Hände zu deinen Geboten erheben, die ich liebe, und mich in deinen
    Satzungen üben. Zain.
  49: Sei eingedenk deiner Verheißung deinem Diener, in der du mir Hoffnung gegeben!
  50: Dies ist mein Trost in meinem Elende, denn dein Wort belebt mich.
  51: Übermütige frevelten allenthalben, ich aber bin von deinem Gesetze nicht abgewichen.
  52: Ich gedachte deiner Gerichte von Anbeginn, Herr! und fand Trost.
  53: Unmut hat mich erfasst um der Sünder willen, die dein Gesetz verlassen.
  54: Lobpreis sind mir deine Satzungen am Orte meiner Pilgerschaft.
  55: Des Nachts bin ich deines Namens eingedenk, o Herr! und beobachte dein Gesetz.
  56: Dies ward mein Teil, denn ich habe deinen Satzungen nachgestrebt. Heth.
  57: Mein Anteil, o Herr! bist du, dein Gesetz zu halten verspreche ich.
  58: Aus meinem ganzen Herzen flehe ich zu dir empor, erbarme dich meiner nach deiner
    Verheißung.
  59: Ich überdenke meine Wege und lenke meine Füße deinen Zeugnissen zu.
  60: Bereit bin ich und schrecke nicht zurück, deine Gebote zu halten.
  61: Die Schlingen der Sünder haben mich umfasst, doch dein Gesetz vergesse ich nicht.
  62: Ich stehe um Mitternacht auf, dich zu preisen deiner gerechten Gebote wegen.
  63: Ich bin der Genosse aller, die dich fürchten, und derer, die deine Gebote beobachten.
  64: Die Erde, o Herr! ist voll von deiner Huld, deine Satzungen lehre mich! Teth.
  65: Du hast deinem Diener Gutes erwiesen, Herr! gemäß deinem Worte.
  66: Lehre mich Güte, Zucht und Erkenntnis, denn auf deine Gebote setze ich mein
    Vertrauen.
  67: Bevor ich gebeugt ward, habe ich gefehlt, darum beobachte ich dein Wort.
  68: Du bist gütig, in deiner Güte lehre mich deine Satzungen!
  69: Gar sehr hat sich die Bosheit der Stolzen wider mich gemehrt, ich aber sinne
    von ganzem Herzen deinen Geboten nach.
  70: Geronnen ist wie Milch ihr Herz; ich aber betrachte dein Gesetz.
  71: Es ist mir heilsam, dass ich gedemütigt ward, damit ich deine Satzungen lernte.
  72: Besser ist für mich das Gesetz deines Mundes als Tausende Goldes und Silbers.
    Jod.
  73: Deine Hände haben mich gemacht und gebildet; gib mir Einsicht, dass ich deine
    Gebote lerne.
  74: Die dich fürchten, werden mich sehen und sich freuen, denn auf deine Worte setze
    ich alle meine Hoffnung.
  75: Ich weiß, Herr! dass deine Gerichte gerecht sind, dass du mich in deiner Treue
    gedemütigt hast.
  76: Möchte deine Huld mich trösten nach deiner Verheißung an deinen Diener!
  77: Möchte dein Erbarmen über mich kommen, dass ich lebe; denn dein Gesetz ist meine
    Betrachtung.
  78: Zuschanden mögen werden die Übermütigen, denn sie haben mir Böses getan ohne
    Ursache, ich aber befleißige mich deiner Gebote.
  79: Es mögen sich zu mir wenden, die dich fürchten und die deine Zeugnisse kennen.
  80: Möge mein Herz in deinen Satzungen unsträflich sein, auf dass ich nicht zuschanden
    werde. Kaph.
  81: Meine Seele schmachtet nach deinem Heile und auf dein Wort setze ich alle meine
    Hoffnung.
  82: 'Meine Augen schmachten nach deinem Worte und sagen: Wann wirst du mich trösten?'
  83: Denn ich bin wie ein Schlauch im Reife geworden, deine Satzungen habe ich nicht
    vergessen.
  84: Wie viel sind noch der Tage deines Dieners, wann wirst du Gericht halten über
    meine Verfolger?
  85: Die Gottlosen sprechen vor mir eitle Dinge, doch nichts wie dein Gesetz.
  86: Alle deine Gebote sind Wahrheit, ohne Ursache haben sie mich verfolgt, hilf
    mir!
  87: Gar leicht hätten sie mich auf Erden vernichtet, doch ich verließ deine Satzungen
    nicht.
  88: Nach deiner Huld belebe mich, so will ich die Zeugnisse deines Mundes bewahren.
    Lamed.
  89: Auf ewig, o Herr! steht dein Wort im Himmel fest.
  90: Von Geschlecht zu Geschlecht währt deine Treue, du hast die Erde gegründet und
    sie dauert fort.
  91: Durch deine Anordnung steht die Zeit fest, denn alles dient dir.
  92: Wäre nicht dein Gesetz meine Betrachtung, so wäre ich wohl umgekommen in meinem
    Elende.
  93: Ich werde deine Satzungen ewig nicht vergessen, denn durch sie hast du mich
    am Leben erhalten.
  94: Dein bin ich, hilf mir, denn deine Satzungen suche ich.
  95: Die Sünder lauern mir auf, um mich zu verderben; aber ich richte meinen Sinn
    auf deine Zeugnisse.
  96: Aller geschaffenen Dinge sah ich ein Ende, aber dein Gebot ist überaus weitreichend.
    Mem.
  97: Wie liebe ich dein Gesetz so sehr, o Herr! den ganzen Tag ist es meine Betrachtung.
  98: Du machst mich weiser als meine Feinde durch dein Gebot, denn immerdar bleibt
    es bei mir.
  99: Weiser bin ich als alle, die mich lehrten, denn deine Zeugnisse sind mein Sinnen.
  100: Ich bin weiser als Greise, denn deine Gebote suchte ich.
  101: Von jedem bösen Wege hielt ich meine Füße zurück, damit ich deine Worte beobachtete.
  102: Von deinen Ordnungen wich ich nicht, denn du gabst sie mir als Gesetz.
  103: Wie süß sind deine Worte meinem Gaumen, süßer meinem Munde als Honig!
  104: Aus deinen Geboten ward ich einsichtig, darum hasse ich jeden Weg des Unrechts.
    Nun.
  105: Dein Wort ist meinen Füßen eine Leuchte und ein Licht auf meinen Wegen.
  106: Ich schwur und nahm mir vor, deine gerechten Ordnungen zu beobachten.
  107: Ich bin schwer gebeugt, o Herr! belebe mich nach deinem Worte.
  108: Lass dir, Herr! die freiwilligen Opfer meines Mundes wohlgefällig sein und
    lehre mich deine Ordnungen.
  109: Mein Leben trage ich beständig in meinen Händen, aber ich habe dein Gesetz
    nicht vergessen.
  110: Die Sünder haben mir Fallstricke gelegt, doch ich bin von deinen Geboten nicht
    abgeirrt.
  111: Deine Zeugnisse habe ich zum Erbe erlangt auf immer, denn sie sind das Frohlocken
    meines Herzens.
  112: Meines Herzens Neigung richtete ich darauf, deine Satzungen auf immer zu tun
    um der Vergeltung willen. Samech.
  113: Die Ungerechten hasse ich, doch dein Gesetz habe ich lieb.
  114: Du bist mein Helfer und mein Beschirmer und auf dein Wort setze ich alle meine
    Hoffnung.
  115: Weichet von mir, ihr Bösewichter! denn ich will die Gebote meines Gottes durchforschen.
  116: O nimm mich auf nach deiner Verheißung, dass ich lebe, und lass meine Hoffnung
    nicht zuschanden werden!
  117: Hilf mir, so werde ich errettet und ich werde in deinen Satzungen immerdar
    sinnen.
  118: Du verwirfst alle, die von deinen Satzungen abirren, denn ihr Sinnen ist ungerecht.
  119: Für Übertreter erachte ich alle Sünder auf Erden, darum liebe ich deine Zeugnisse.
  120: Durchbohre mit der Furcht vor dir mein Fleisch! denn ich fürchte mich vor deinen
    Gerichten. Ain.
  121: Ich habe Recht und Gerechtigkeit geübt, gib mich nicht denen preis, die mir
    Gewalt antun!
  122: Tritt ein für deinen Diener zu seinem Heile, dass die Stolzen mich nicht unterdrücken!
  123: Meine Augen schmachten nach deinem Heile und nach der Zusage deiner Gerechtigkeit.
  124: Verfahre mit deinem Diener deiner Huld gemäß und deine Satzungen lehre mich!
  125: Ich bin dein Diener; gib mir Einsicht, dass ich deine Zeugnisse erkenne!
  126: Zeit ist es, zu handeln, o Herr! sie haben dein Gesetz zunichte gemacht.
  127: Darum liebe ich deine Gebote mehr als Gold und Edelsteine.
  128: Darum richte ich mich nach allen deinen Geboten, hasse alle ungerechten Wege.
    Phe.
  129: Gar wunderbar sind deine Zeugnisse, darum hat meine Seele sie erforscht.
  130: Die Belehrung deiner Worte erleuchtet und gibt den Unmündigen Einsicht.
  131: Ich öffne meinen Mund und atme lechzend, denn nach deinen Geboten verlangt
    mich.
  132: O schaue auf mich und erbarme dich meiner, nach dem Recht derer, die deinen
    Namen lieben.
  133: Leite meine Schritte nach deinem Ausspruche und kein Unrecht habe Macht über
    mich!
  134: Erlöse mich von den Bedrückungen der Menschen, dass ich deine Gebote halte.
  135: Lass dein Angesicht leuchten über deinen Diener und lehre mich deine Satzungen!
  136: Wasserbäche sind meinen Augen entströmt, weil sie dein Gesetz nicht beobachtet
    haben. Sade.
  137: Du bist gerecht, o Herr! und recht sind deine Gerichte.
  138: Du hast als Gerechtigkeit deine Zeugnisse geboten und deine Treue gar sehr.
  139: Mein Eifer verzehrt mich, weil meine Feinde deine Worte vergessen haben.
  140: Gar sehr ist dein Ausspruch in Feuer erprobt und dein Diener hat ihn lieb.
  141: Ich bin jung und verachtet, aber deine Satzungen vergesse ich nicht.
  142: Deine Gerechtigkeit ist Gerechtigkeit auf ewig und dein Gesetz Wahrheit.
  143: Trübsal und Bedrängnis haben mich betroffen, deine Gebote sind meine Betrachtung.
  144: Ewig sind deine Zeugnisse gerecht; gib mir Einsicht, so werde ich leben. Koph.
  145: Aus ganzem Herzen rufe ich, erhöre mich, Herr! so will ich deinen Satzungen
    nachforschen.
  146: Ich rufe zu dir, hilf mir, dass ich deine Gebote beobachte!
  147: Schon früh nahe ich dir und rufe, denn ich hoffe gar sehr auf deine Worte.
  148: Meine Augen richten sich zu dir schon vor der Morgendämmerung, damit ich deine
    Verheißungen betrachte.
  149: Herr! erhöre meine Stimme nach deiner Huld und nach deiner Gerechtigkeit belebe
    mich.
  150: Es nahen sich, die mich verfolgen, der Bosheit, aber von deinem Gesetze sind
    sie fern.
  151: Nahe bist du, Herr! und alle deine Wege sind Wahrheit.
  152: Längst weiß ich aus deinen Zeugnissen, dass du sie auf ewig gegründet hast.
    Resch.
  153: Siehe meine Niedrigkeit an und errette mich, denn dein Gesetz habe ich nicht
    vergessen.
  154: Entscheide meinen Handel und erlöse mich, um deiner Verheißung willen belebe
    mich!
  155: Fern ist von den Sündern Heil, denn sie suchen deine Satzungen nicht.
  156: Deine Erbarmung, Herr! ist groß, nach deinem Rechte belebe mich.
  157: Viele verfolgen und bedrängen mich, von deinen Zeugnissen weiche ich nicht
    ab.
  158: Sehe ich Übertreter, so härme ich mich ab, weil sie deine Aussprüche nicht
    beobachten.
  159: Siehe, Herr! dass ich deine Gebote liebe, nach deiner Huld belebe mich.
  160: Auf Wahrheit beruhen alle deine Worte, ewig währen alle Satzungen deiner Gerechtigkeit.
    Sin.
  161: Fürsten verfolgen mich ohne Ursache, doch vor deinen Worten bebt mein Herz.
  162: Ich freue mich über deine Verheißungen, wie einer, der auf große Beute trifft.
  163: Ich hasse das Unrecht und verabscheue es, doch dein Gesetz liebe ich.
  164: Siebenmal des Tages spreche ich dein Lob wegen deiner gerechten Satzungen.
  165: Reich an Frieden sind, die dein Gesetz lieben, und es gibt für sie keinen Anstoß.
  166: Ich harre auf dein Heil, o Herr! und liebe deine Gebote.
  167: Meine Seele beobachtet deine Zeugnisse und liebt sie gar sehr.
  168: Ich halte deine Gebote und deine Zeugnisse; denn alle meine Wege sind dir offenbar.
    Tau.
  169: Lass mein Flehen vor dein Angesicht gelangen, o Herr! nach deiner Verheißung
    gib mir Einsicht.
  170: Lass meine Bitte vor dein Angesicht kommen, nach deiner Verheißung errette
    mich!
  171: Meine Lippen sollen überströmen von Lobpreis, weil du mich deine Satzungen
    gelehrt hast.
  172: Meine Zunge soll deine Aussprüche verkünden, denn alle deine Gebote sind Gerechtigkeit.
  173: Deine Hand möge mich erretten, denn deine Gebote habe ich erwählt.
  174: Ich sehne mich nach deinem Heile, o Herr! und dein Gesetz ist meine Betrachtung.
  175: Meine Seele wird leben und dich loben und deine Gerichte werden mir helfen.
  176: Ich gehe irre wie ein Schaf, das verloren gegangen, suche deinen Diener, denn
    deine Gebote vergaß ich nicht.
  177: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  178: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
