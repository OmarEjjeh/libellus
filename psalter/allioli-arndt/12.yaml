# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 12
verses:
  1: Wie lange, Herr! wirst du meiner so ganz vergessen? Wie lange noch dein Angesicht
    von mir wenden?
  2: Wie lange soll ich in meiner Seele Pläne schaffen, Schmerzen leiden in meinem
    Herzen Tag für Tag?
  3: Wie lange soll sich mein Feind über mich erheben? Schau her und erhöre mich,
    o Herr, mein Gott!
  4: 'Erleuchte meine Augen, dass ich nicht etwa in Todesschlaf sinke; dass mein Feind
    nicht sagen könne: Ich bin seiner mächtig geworden;'
  5: es würden meine Quäler frohlocken, wenn ich wankte. Doch ich vertraue auf deine
    Erbarmung,
  6: es frohlockt mein Herz ob deines Heiles, ich will dem Herrn lobsingen, der mir
    Gutes getan, und den Namen des Herrn, des Allerhöchsten, preisen.
  7: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  8: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
