# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 122
verses:
  1: Zu dir erhebe ich meine Augen, der du im Himmel wohnst!
  2: Siehe! wie die Augen der Knechte auf die Hände ihrer Herren.
  3: Wie die Augen der Magd auf die Hände ihrer Gebieterin, so schauen unsere Augen
    auf den Herrn, unsern Gott, bis er sich unser erbarmt.
  4: Erbarme dich unser, o Herr! erbarme dich unser; gar sehr sind wir gesättigt mit
    Verachtung.
  5: ja, reichlich gesättigt sind unsere Seelen, zum Gespötte sind wir den Reichen
    und zur Verachtung den Stolzen.
  6: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  7: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
