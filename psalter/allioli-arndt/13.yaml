# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 13
verses:
  1: 'Es spricht der Tor in seinem Herzen: „Es ist kein Gott!“'
  2: Verderbt sind sie und verabscheuungswürdig sind sie geworden in ihren Anschlägen.
    Keiner ist, der Gutes tue, auch nicht ein einziger.
  3: Der Herr blickt vom Himmel auf die Menschenkinder, zu sehen, ob einer einsichtig
    sei oder nach Gott frage.
  4: Alle sind abgewichen, insgesamt unnütz geworden; keiner ist, der Gutes tue, auch
    nicht ein einziger.
  5: Ein offenes Grab ist ihr Schlund; mit ihren Zungen handeln sie trüglich, Natterngift
    ist unter ihren Lippen.
  6: Von Lästerung und Bitterkeit ist ihr Mund voll, behend sind ihre Füße zum Blutvergießen.
  7: Verderben und Unglück sind auf ihren Wegen und den Weg des Friedens kennen sie
    nicht, die Furcht Gottes ist nicht vor ihren Augen.
  8: Sind nicht ohne Einsicht alle, die Übles tun, die mein Volk verschlingen wie
    einen Bissen Brot?
  9: Den Herrn riefen sie nicht an; dort zitterten sie vor Furcht, wo nichts zu fürchten
    war.
  10: Denn der Herr ist mit dem Geschlechte der Gerechten; den Ratschluss des Armen
    habt ihr verhöhnt, dass der Herr seine Hoffnung sei.
  11: O dass doch Israel Heil aus Sion käme! Wenn der Herr die Gefangenschaft seines
    Volkes abwendet, wird Jakob frohlocken und Israel sich freuen!
  12: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  13: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
