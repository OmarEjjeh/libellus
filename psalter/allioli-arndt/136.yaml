# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 136
verses:
  1: An den Strömen Babylons, dort saßen wir und weinten, indem wir Sions gedachten.
  2: An den Weiden, in des Landes Mitte, hingen wir unsere Harfen auf.
  3: Denn die uns gefangen fortgeführt, forderten daselbst von uns Lieder,
  4: 'Und die uns hinweggeschleppt hatten, sprachen: „Singet uns ein Loblied von Sions
    Liedern!“'
  5: Wie sollten wir des Herrn Lied singen in fremdem Lande?
  6: Wenn ich dein vergesse, Jerusalem, so möge meine Rechte der Vergessenheit anheimfallen.
  7: Meine Zunge klebe an meinem Gaumen, wenn ich deiner nicht gedenke,
  8: Wenn ich Jerusalem nicht achte als den Gipfel meiner Freuden!
  9: Gedenke, Herr! den Söhnen Edoms den Tag Jerusalems,
  10: 'Die da sprachen: Zerstöret, zerstöret sie bis auf den Grund!'
  11: Tochter Babylons, du Unglückselige! Wohl dem, der dir nach Verdienst vergelten
    wird, was du an uns getan!
  12: Wohl dem, der deine kleinen Kinder ergreift und sie an den Fels hinschmettert!
  13: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  14: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
