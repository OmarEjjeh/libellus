# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 137
verses:
  1: Ich will dich preisen, Herr! von ganzem Herzen, denn du hast die Worte meines
    Mundes erhört;
  2: Angesichts der Engel will ich dir lobsingen, will anbeten gegen deinen heiligen
    Tempel hin und deinen Namen preisen,
  3: Um deiner Güte und deiner Treue willen, denn du hast deinen heiligen Namen überaus
    groß gemacht.
  4: An welchem Tage immer ich dich anrufe, erhöre mich; du wollest die Kraft in meiner
    Seele mehren!
  5: Es sollen dich preisen, Herr! alle Könige der Erde, weil sie alle Worte deines
    Mundes vernommen,
  6: und sollen singen von den Wegen des Herrn, denn groß ist die Herrlichkeit des
    Herrn.
  7: Denn erhaben ist der Herr und schaut auf das Niedrige und erkennt das Hohe von
    ferne.
  8: Wenn ich inmitten von Drangsal wandeln muss, wirst du mich am Leben erhalten;
    und wider den Zorn meiner Feinde wirst du deine Hand ausstrecken, und deine Rechte
    wird mir helfen.
  9: Der Herr wird für mich vergelten. Herr! deine Barmherzigkeit währt ewig; verschmähe
    die Werke deiner Hände nicht!
  10: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  11: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
