# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 138
verses:
  1: Herr, du erforschest mich und erkennst mich, du kennst mein Sitzen und mein Aufstehen.
  2: Du verstehst meine Gedanken von ferne, du durchforschest meinen Pfad und meinen
    Anteil
  3: und alle meine Wege siehst du voraus; denn es ist kein Wort auf meiner Zunge.
  4: Siehe, Herr! du weißt alles, das Neue und das Alte; du hast mich gebildet und
    deine Hand auf mich gelegt.
  5: Allzu wunderbar ist dein Wissen für mich; zu hoch ist es, ich vermag nicht es
    zu erreichen!
  6: Wohin soll ich gehen vor deinem Geiste? Und wohin fliehen vor deinem Angesichte?
  7: Stiege ich zum Himmel empor, so bist du da; stiege ich in die Unterwelt hinab,
    so bist du da!
  8: Erhöbe ich bei der Morgenröte meine Flügel und ließe mich nieder am äußersten
    Ende des Meeres,
  9: so wird auch dort deine Hand mich leiten und deine Rechte mich lenken.
  10: 'Und spräche ich: Vielleicht kann Finsternis mich decken, so wird die Nacht
    mir Licht bei meiner Freude.'
  11: Denn vor dir ist die Finsternis nicht dunkel und die Nacht hell wie der Tag;
    wie ihre Finsternis, so ist sein Licht!
  12: Denn du hast meine Nieren in deiner Gewalt; du nahmst dich meiner von meiner
    Mutter Leibe her an.
  13: Ich preise dich, dass du so ehrfurchtgebietend bist; deine Werke sind wunderbar
    und meine Seele erkennt dies wohl.
  14: Mein Gebein war nicht verborgen vor dir, das du im Verborgenen gebildet hast,
    noch mein Wesen in der Erde tiefem Schoße.
  15: Da ich noch unvollendet war, sahen mich deine Augen und in dein Buch sind alle
    verzeichnet; ihre Tage sind bestimmt, ehe noch jemand in denselben da ist.
  16: Aber bei mir sind deine Freunde, o Gott! hoch geehrt, ihr Vorrang ist überaus
    mächtig geworden.
  17: Wollte ich sie zählen, so sind ihrer mehr als der Sand; stehe ich auf, so bin
    ich noch bei dir!
  18: O dass du die Sünder töten wolltest, o Gott! ihr Männer des Blutes, weichet
    von mir!
  19: 'Denn ihr sagt bei euch: Deine Städte werden sie vergeblich gewinnen!'
  20: Sollte ich die nicht hassen, Herr! die dich hassen, und über deine Feinde mich
    nicht härmen?
  21: Mit vollstem Hasse hasse ich sie und als Feinde Gottes gelten sie mir.
  22: Prüfe mich, o Gott! und erkenne mein Herz, erforsche mich und erkenne meine
    Pfade
  23: und siehe, ob ich auf bösem Wege bin, und leite mich auf ewigem Wege!
  24: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  25: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
