# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 142
verses:
  1: Herr! erhöre mein Gebet, vernimm mein Flehen nach deiner Treue, erhöre mich nach
    deiner Gerechtigkeit
  2: und gehe nicht ins Gericht mit deinem Diener, denn vor deinem Angesichte wird
    kein Lebender gerecht erfunden!
  3: Denn der Feind verfolgt meine Seele, tritt mein Leben zur Erde.
  4: Stößt mich in die Finsternis hinab, gleich den längst Verstorbenen. Und mein
    Geist ist in mir geängstet, mein Herz in mir erschrocken.
  5: Ich gedenke der alten Zeiten, ich sinne all deinem Tun nach, betrachte, was deine
    Hände vollbracht.
  6: Ich breite meine Hände aus zu dir; wie wasserloses Land dürstet meine Seele nach
    dir.
  7: Eilends erhöre mich, Herr! mein Geist schwindet dahin.
  8: O wende dein Angesicht nicht von mir, dass ich nicht denen gleich werde, die
    in die Grube fahren.
  9: Lass mich früh deine Erbarmung hören, denn auf dich hoffe ich.
  10: Tue mir den Weg kund, auf dem ich wandeln soll, denn zu dir erhebe ich meine
    Seele.
  11: Errette mich von meinen Feinden, o Herr! zu dir nehme ich meine Zuflucht. Nach
    deinem Willen lehre mich tun, denn du bist mein Gott.
  12: Dein gütiger Geist führe mich auf rechter Bahn! Um deines Namens willen belebe
    mich wieder.
  13: Nach deiner Gerechtigkeit rette aus der Drangsal meine Seele, und nach deiner
    Barmherzigkeit zerstreue meine Feinde.
  14: Und vernichte alle, die meine Seele bedrängen, denn ich bin dein Diener!
  15: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  16: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
