# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 144
verses:
  1: Ich will dich erheben, Gott, mein König! und deinen Namen immerdar und ewig preisen.
  2: Ich will dich preisen jeden Tag und deinen Namen immerdar und ewig loben.
  3: Der Herr ist groß und sehr preiswürdig und seiner Größe ist kein Ende.
  4: Ein Geschlecht rühme dem anderen deine Werke und verkünde deine Macht.
  5: Sie sollen die hehre Herrlichkeit deiner Heiligkeit verkünden und deine Wundertaten
    erzählen,
  6: die Gewalt deiner Schreckenstaten preisen und deine Größe verkünden.
  7: Das Gedächtnis deiner übergroßen Lieblichkeit sollen sie reichlich kund tun und
    ob deiner Gerechtigkeit jubeln.
  8: Gnädig und barmherzig ist der Herr, langmütig und von reicher Erbarmung.
  9: Liebreich ist der Herr gegen alle und seine Erbarmungen erstrecken sich über
    alle seine Werke.
  10: O Herr! alle deine Werke sollen dich preisen und deine Heiligen dich rühmen.
  11: Die Herrlichkeit deines Königtums sollen sie verkünden und von deiner Macht
    erzählen,
  12: um den Menschenkindern deine Macht kundzutun und die Pracht und Herrlichkeit
    deines Königtums.
  13: Dein Königtum ist ein Königtum auf ewige Zeiten und deine Herrschaft von Geschlecht
    zu Geschlecht.
  14: Der Herr ist getreu in allen seinen Worten und heilig in allen seinen Werken.
  15: Der Herr stützt alle, die sinken, und richtet alle Gebeugten auf.
  16: Aller Augen harren auf dich, Herr! und du gibst ihnen Speise zu rechter Zeit.
  17: Du öffnest deine Hand und sättigst alles, was lebt, mit Segen.
  18: Gerecht ist der Herr auf allen seinen Wegen und heilig in seinen Werken.
  19: Nahe ist der Herr allen, die ihn anrufen, allen, die ihn anrufen in Aufrichtigkeit.
  20: Er tut den Willen derer, die ihn fürchten, und erhört ihr Flehen und rettet
    sie.
  21: Der Herr behütet alle, die ihn lieben, jedoch alle Sünder wird er vertilgen.
  22: Es soll mein Mund des Herrn Lob verkünden und alles Fleisch soll seinen heiligen
    Namen preisen, immerdar und ewig!
  23: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  24: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
