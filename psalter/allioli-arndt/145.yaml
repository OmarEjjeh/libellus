# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 145
verses:
  1: Lobe, meine Seele, den Herrn! Ich will den Herrn loben, so lange ich lebe; meinem
    Gott lobsingen, so lange ich lebe.
  2: Vertrauet nicht auf Fürsten, auf Menschenkinder, die nicht helfen können!
  3: Wenn sein Odem ausgeht, kehrt er zurück zu seiner Erde; an jenem Tage vergehen
    alle ihre Gedanken.
  4: Glückselig, wessen Helfer der Gott Jakobs ist, der seine Hoffnung auf den Herrn,
    seinen Gott, setzt, der Himmel und Erde erschaffen hat, das Meer und alles, was
    darin ist;
  5: der ewig Treue wahrt, Recht schafft denen, die Unrecht leiden, und den Hungrigen
    Speise gibt.
  6: Der Herr erlöst die Gefangenen, der Herr erleuchtet die Blinden.
  7: Der Herr richtet die Gebeugten auf, der Herr liebt die Gerechten.
  8: Der Herr beschützt die Fremdlinge, der Waise und der Witwe nimmt er sich an und
    vernichtet die Wege der Sünder.
  9: Der Herr ist König in Ewigkeit, dein Gott, o Sion! von Geschlecht zu Geschlecht.
  10: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  11: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
