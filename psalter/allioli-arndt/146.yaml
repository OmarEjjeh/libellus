# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 146
verses:
  1: Lobet den Herrn, denn Lobsingen ist gut; liebliches und fröhliches Lob werde
    unserm Gott dargebracht.
  2: Der Herr erbaut Jerusalem, er sammelt die Zerstreuten von Israel.
  3: Er heilt, die zerknirschten Herzens sind, und verbindet ihre Wunden.
  4: Er zählt die Menge der Sterne, ruft sie alle mit Namen.
  5: Groß ist unser Herr und groß seine Macht und seiner Weisheit ist kein Maß.
  6: Der Herr erhebt die Sanftmütigen und beugt die Sünder in den Staub.
  7: Singet dem Herrn mit Jubel, preiset unsern Gott auf der Zither!
  8: Er überzieht den Himmel mit Gewölk und bereitet Regen der Erde.
  9: Er lässt Gras auf den Bergen sprossen und Kräuter zum Dienste der Menschen.
  10: Er gibt dem Vieh seine Nahrung und den jungen Raben, die zu ihm rufen.
  11: Er hat nicht Lust an der Stärke des Rosses noch Wohlgefallen an den Schenkeln
    des Mannes.
  12: Der Herr hat Wohlgefallen an denen, die ihn fürchten, und an denen, die auf
    seine Barmherzigkeit hoffen.
  13: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  14: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
