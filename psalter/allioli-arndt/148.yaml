# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 148
verses:
  1: Lobet den Herrn vom Himmel her; lobet ihn in den Höhen!
  2: Lobet ihn, alle seine Engel; lobet ihn, alle seine Heerscharen!
  3: Lobet ihn, Sonne und Mond; lobet ihn, alle leuchtenden Sterne!
  4: Lobet ihn, Himmel der Himmel, und alle Wasser, die über dem Himmel sind, sollen
    den Namen des Herrn loben!
  5: Denn er sprach und sie sind geworden, er befahl und sie wurden geschaffen.
  6: Er stellte sie hin auf immer und ewig, er gab ihnen ein Gesetz und es wird nicht
    vergehen.
  7: Lobet den Herrn von der Erde her, ihr Ungeheuer und alle Tiefen!
  8: Feuer, Hagel, Schnee, Eis, Sturmwind, die sein Wort ausrichten!
  9: Ihr Berge und alle Hügel, ihr Fruchtbäume und alle Zedern!
  10: Ihr wilden Tiere und alles Vieh, ihr Gewürm und gefiederte Vögel!
  11: Ihr Könige der Erde und alle Völker, ihr Fürsten und alle Richter der Erde!
  12: Jünglinge und Jungfrauen, jung und alt, sollen den Namen des Herrn loben; denn
    erhaben ist sein Name allein!
  13: Seine Herrlichkeit überragt Himmel und Erde; er hat das Horn seines Volkes erhöht.
  14: Lobpreis ziemt allen seinen Heiligen, den Söhnen Israel, dem Volke, das ihm
    nahe ist. Alleluja!
  15: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  16: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
