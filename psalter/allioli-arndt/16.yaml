# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 16
verses:
  1: Erhöre, Herr! meine gerechte Sache. Merke auf mein Flehen.
  2: Vernimm mein Gebet, das von Lippen ohne Trug ausgeht.
  3: Lass von deinem Angesichte mein Recht ausgehen; deine Augen mögen auf das schauen,
    was recht ist.
  4: Prüfest du mein Herz und suchst es des Nachts heim, erprobst du mich im Feuer,
    kein Unrecht wird an mir erfunden.
  5: Auf dass mein Mund nicht von Menschenwerken rede, um der Worte deiner Lippen
    willen mied ich die Pfade des Unheils.
  6: Mache meinen Wandel standhaft auf deinen Wegen, dass meine Tritte nicht wanken.
  7: Ich rufe zu dir, denn du erhörst mich, o Gott! neige dein Ohr zu mir und höre
    meine Rede!
  8: Erweise mir deine wunderbaren Erbarmungen, der du die rettest, die auf dich hoffen.
  9: Behüte mich wie deinen Augapfel vor den Widersachern deiner Rechten;
  10: unter dem Schatten deiner Flügel beschirme mich, vor den Gottlosen, die mich
    vergewaltigen.
  11: Meine Feinde umgeben meine Seele, verschlossen haben sie ihr gefühlloses Herz,
    ihr Mund führt stolze Reden.
  12: Schon haben sie mich hinausgestoßen und umringen mich jetzt, sie richten ihr
    Absehen darauf, mich zu Boden zu strecken.
  13: Sie lauern mir auf wie ein Löwe, gierig nach Raub, und wie ein junger Löwe,
    der im Verstecke liegt.
  14: Auf, o Herr! komm ihm zuvor und wirf ihn nieder; rette meine Seele vor dem Gottlosen,
    entreiß dein Schwert den Feinden deiner Hand.
  15: Herr! aus den wenigen von der Erde weg scheide sie in der Fülle des Lebens.
    Mit deinen verborgenen Schätzen ist ihr Bauch erfüllt;
  16: sie haben Söhne in Fülle und diese hinterlassen ihren Kindern ihren Überfluss.
  17: Ich aber werde in Gerechtigkeit vor deinem Angesichte erscheinen, mich ersättigen,
    wenn sich deine Herrlichkeit offenbart.
  18: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  19: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
