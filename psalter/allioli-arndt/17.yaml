# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 17
verses:
  1: Ich liebe dich, o Herr! meine Stärke. Der Herr ist meine Stütze, meine Zuflucht
    und mein Erretter;
  2: mein Gott ist mein Helfer, ich hoffe auf ihn;
  3: er ist mein Beschirmer und das Horn meines Heiles, er nimmt sich meiner an.
  4: Lobpreisend rufe ich den Herrn an und werde errettet von meinen Feinden.
  5: Es haben mich Todesschmerzen umgeben und des Frevels Ströme mich erschreckt.
  6: Der Unterwelt Schmerzen umfingen mich, es fassten mich unverhofft Todesschlingen.
  7: Da rief ich in meiner Drangsal zu dem Herrn und schrie zu meinem Gott.
  8: Und er hörte meine Stimme aus seinem heiligen Tempel und mein Rufen kam vor ihn
    und drang zu seinen Ohren.
  9: Es wankte und bebte die Erde, der Berge Festen zitterten und wankten, denn er
    war ergrimmt über sie.
  10: Bei seinem Grimme stieg Rauch auf und vor ihm her brannte Feuer, Glut hat er
    entzündet.
  11: Er neigte die Himmel und stieg hernieder, Dunkel war unter seinen Füßen.
  12: Und er stieg auf Cherubim und flog dahin, flog dahin auf den Flügeln des Windes.
  13: Er machte Finsternis zu seiner Hülle, rings um sich her zu seinem Zelte, Wasserdunkel
    und dichte Wolken der Lüfte.
  14: Vor seines Angesichts Glanze zogen Wolken daher mit Hagelschauer und Feuersglut.
  15: Und der Herr donnerte vom Himmel, der Höchste ließ seine Stimme erschallen,
    Hagelschauer und Feuersglut.
  16: Und er entsandte seine Pfeile und zerstreute sie, sandte Blitze auf Blitze nieder
    und erschreckte sie.
  17: Da zeigten sich die Tiefen der Wasser und bloßgelegt wurden die Grundfesten
    des Erdkreises,
  18: Vor deinem Dräuen, o Herr! vor dem Brausen deines schnaubenden Zornes.
  19: Er griff hernieder aus der Höhe und erfasste mich und zog mich heraus aus gewaltigen
    Wassern.
  20: Er entriss mich meinen starken Feinden und denen, die mich hassten; denn sie
    waren stärker als ich.
  21: Sie überfielen mich am Tage meiner Drangsal, doch der Herr ward mein Beschützer.
  22: Er führte mich hinaus in freien Raum, rettete mich, weil er Wohlgefallen an
    mir hatte.
  23: Und der Herr vergilt mir nach meiner Gerechtigkeit, er vergilt mir nach der
    Reinheit meiner Hände;
  24: denn ich beobachtete die Wege des Herrn und handelte nicht frevelnd gegen meinen
    Gott.
  25: Alle seine Rechte hatte ich ja vor Augen und seine Satzungen stieß ich nicht
    von mir.
  26: So war ich fleckenlos vor ihm und hütete mich vor meiner Verschuldung.
  27: Und der Herr vergalt mir nach meiner Gerechtigkeit und nach der Reinheit meiner
    Hände vor seinen Augen.
  28: Gegen den Heiligen zeigst du dich heilig und gegen den Unschuldigen zeigst du
    dich unschuldig.
  29: Gegen den Auserlesenen zeigst du dich auserlesen und gegen den Verkehrten zeigst
    du dich verkehrt.
  30: Ja, dem bedrückten Volke schaffst du Hilfe, aber die Augen der Stolzen demütigst
    du.
  31: Ja, du, o Herr! gibst meiner Leuchte Licht; mein Gott, erhelle meine Finsternis.
  32: Ja, durch dich werde ich der Versuchung entrissen und mit meinem Gott überspringe
    ich Mauern.
  33: Meines Gottes Weg ist unbefleckt, des Herrn Wort ist im Feuer bewährt; ein Schirm
    ist er allen, die auf ihn vertrauen.
  34: Denn wer ist Gott außer dem Herrn? oder wer ist Gott außer unserm Gott?
  35: Gott ist es, der mich mit Kraft umgürtete und meinen Weg makellos machte,
  36: der meine Füße den Hirschen gleichmachte und mich auf Höhen stellte,
  37: der meine Hände streiten lehrt und meine Arme gleichmacht dem ehernen Bogen.
  38: Du reichst mir den Schutz deines Heiles und deine Rechte stützt mich,
  39: Deine Zucht bessert mich gänzlich und deine Zucht, gerade sie lehrt mich.
  40: Du machest weiten Raum für meine Schritte unter mir und meine Füße wanken nicht.
  41: Ich verfolge meine Feinde und hole sie ein und kehre nicht um, bis sie vertilgt
    sind.
  42: Ich zerschmettere sie, dass sie sich nicht erheben können; sie werden unter
    meine Füße stürzen.
  43: Du umgürtest mich mit Kraft zum Kampfe, lässest meine Widersacher vor mir zu
    Falle kommen.
  44: Meine Feinde wendest du vor mir in die Flucht und meine Hasser vertilgst du.
  45: Sie rufen zu dem Herrn und niemand hilft ihnen, er hört sie nicht.
  46: Ich zermalme sie wie Staub vor dem Winde, wie Gassenkot zertrete ich sie.
  47: Du rettest mich aus der Empörung des Volkes, du setzest mich zum Haupte der
    Völker.
  48: Ein Volk, das ich nicht kannte, ward mir untertan; da sie nur hörten, gehorchte
    es mir.
  49: Die Söhne der Fremde heucheln mir Unterwerfung, die Söhne der Fremde schwinden
    dahin und ziehen hinkend abseits von ihren Wegen.
  50: Es lebt der Herr, gepriesen sei mein Gott und hoch erhoben werde der Gott meines
    Heils!
  51: O Gott! der du mir Rache verleihst und mir die Völker unterwirfst, du mein Erretter
    von meinen zornentbrannten Feinden;
  52: über meine Widersacher erhöhest du mich, vom Manne des Unrechtes rettest du
    mich.
  53: Darum will ich dich, Herr! unter den Völkern preisen und deinem Namen lobsingen,
  54: der du seinem Könige großes Heil verleihest und seinem Gesalbten Huld erweisest,
    David und seinen Nachkommen in Ewigkeit.
  55: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  56: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
