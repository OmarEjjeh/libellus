# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 19
verses:
  1: Der Herr erhöre dich am Tage der Trübsal, es schirme dich der Name des Gottes
    Jakobs.
  2: Er sende dir Hilfe aus dem Heiligtume und beschütze dich von Sion aus.
  3: Er gedenke all deiner Speiseopfer und dein Brandopfer erfinde er fett.
  4: Er gebe dir, was dein Herz wünscht, und lasse all dein Vorhaben gelingen.
  5: Ob deines Heiles werden wir uns freuen und uns rühmen des Namens unsers Gottes.
  6: Der Herr erfülle all dein Begehren! Nun weiß ich, dass der Herr seinem Gesalbten
    hilft;
  7: Er wird ihn erhören von seinem heiligen Himmel her, denn mächtig ist die Hilfe
    seiner Rechten.
  8: Diese vertrauen auf Wagen und jene auf Rosse, wir aber rufen den Namen des Herrn,
    unsers Gottes, an.
  9: Sie verstricken sich und fallen, wir aber erheben uns und stehen aufrecht.
  10: O Herr! hilf dem Könige und erhöre uns am Tage, da wir zu dir rufen.
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
