# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen und auf
# die Versgrenzen des gesungenen Psalters ausgerichtet (Issue #1). Diese
# Ausrichtung ist automatisch neu gruppiert (Wortfolge identisch, Verszahl urspruenglich verschieden) - siehe Anmerkungen.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 20
verses:
  1: Herr! Ob deiner Macht erfreut sich der König und ob deiner Hilfe frohlockt er
    gar sehr.
  2: Was sein Herz ersehnte, hast du ihm gewährt, und was seine Lippen verlangten,
    versagtest du ihm nicht.
  3: Denn du bist ihm zuvorgekommen mit lieblichen Segnungen, hast ihm auf sein Haupt
    eine Krone von kostbarem Gestein gesetzt.
  4: Um Leben hat er dich gebeten und du gabst ihm langes Leben auf immer und ewig.
  5: Groß ist sein Ruhm ob deiner Gnadenhilfe und große Ruhmesherrlichkeit legtest
    du auf ihn.
  6: Denn du setzest ihn zum Segen auf immer, erfreust ihn mit Wonne vor deinem Angesicht.
  7: Denn der König hofft auf den Herrn und durch die Huld des Allerhöchsten wird
    er nicht wanken.
  8: Deine Hand möge alle deine Feinde erreichen, deine Rechte möge alle erreichen,
    die dich hassen!
  9: Du wirst sie dem Feuerofen gleichmachen, wenn du erscheinst; der Herr wird sie
    in seinem Zorne erschrecken und Feuer sie verzehren.
  10: Ihre Kinder wirst du von der Erde hinweg vertilgen und ihre Nachkommenschaft
    aus den Menschenkindern.
  11: Denn üben sie Tücke wider dich, ersinnen sie Anschläge, sie können sie nicht
    ausführen.
  12: Denn du wirst sie zwingen, den Rücken zu wenden; denen, die du übrig lässest,
    wirst du auf ihr Antlitz zielen.
  13: Erhebe dich, Herr! in deiner Macht, so wollen wir singen und deine Stärke preisen.
  14: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  15: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
