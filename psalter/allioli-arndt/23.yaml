# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 23
verses:
  1: Dem Herrn gehört die Erde und was sie erfüllt; der Erdkreis und alle, die auf
    demselben wohnen.
  2: Denn er hat ihn auf die Meere gegründet und über Ströme ihn festgestellt.
  3: Wer darf den Berg des Herrn betreten? oder wer darf an seiner heiligen Stätte
    stehen?
  4: Wer unschuldige Hände hat und reinen Herzens ist, wer seine Seele nicht an Eitles
    hängt und seinem Nächsten nicht trüglich schwört.
  5: Dieser wird Segen von dem Herrn empfangen und Erbarmen von Gott, seinem Retter.
  6: Dies ist das Geschlecht, das nach ihm verlangt, die das Angesicht des Gottes
    Jakobs suchen.
  7: Erhöhet, ihr Fürsten, eure Tore, hoch wölbet euch, ihr ewigen Tore, und der König
    der Herrlichkeit wird einziehen.
  8: Wer ist dieser König der Herrlichkeit? Der Herr, der Starke und Gewaltige, der
    Herr, mächtig im Streite.
  9: Erhöhet, ihr Fürsten, eure Tore, hoch wölbet euch, ihr ewigen Tore, und der König
    der Herrlichkeit wird einziehen!
  10: Wer ist dieser König der Herrlichkeit? Der Herr der Heerscharen ist der König
    der Herrlichkeit!
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
