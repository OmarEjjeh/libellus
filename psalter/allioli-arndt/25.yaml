# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 25
verses:
  1: Schaffe mir Recht, o Herr! denn ich bin in meiner Unschuld gewandelt, und weil
    ich auf den Herrn gehofft, werde ich nicht unterliegen.
  2: Prüfe mich, Herr! und erprobe mich; erforsche im Feuer meine Nieren und mein
    Herz.
  3: Denn deine Erbarmung steht mir vor Augen und an deiner Wahrheit habe ich Wohlgefallen.
  4: Ich sitze nicht in der Versammlung der Eitelkeit und wandle nicht mit den Missetätern.
  5: Ich hasse die Zusammenkunft der Bösewichter und bei den Gottlosen sitze ich nicht.
  6: Ich wasche mit Unschuldigen meine Hände und trete so zu deinem Altar, o Herr!
  7: Dass ich die Stimme deines Lobes höre und alle deine Wundertaten verkünde.
  8: Herr! ich liebe die Zier deines Hauses und den Ort, wo deine Herrlichkeit wohnt.
  9: Lass, o Gott! nicht mit den Gottlosen meine Seele zugrunde gehen und nicht mit
    den Blutmenschen mein Leben,
  10: an deren Händen Ungerechtigkeiten sind, deren Rechte mit Geschenken gefüllt
    ist.
  11: Ich aber wandle in meiner Unschuld; erlöse mich und erbarme dich meiner!
  12: Mein Fuß steht auf rechtem Wege; ich will dich preisen, o Herr! in den Versammlungen.
  13: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  14: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
