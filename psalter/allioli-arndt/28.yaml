# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 28
verses:
  1: Bringet dem Herrn, ihr Söhne Gottes! bringet dem Herrn junge Widder dar.
  2: Bringet dem Herrn Preis und Ehre dar, bringet dem Herrn Preis, seinem Namen;
    betet den Herrn an in seinem heiligen Vorhofe!
  3: Die Stimme des Herrn erschallt über den Wassern, der Gott der Herrlichkeit lässt
    Donner erdröhnen, der Herr lässt Donner erdröhnen über großen Wassern.
  4: Die Stimme des Herrn ertönt mit Kraft, die Stimme des Herrn in Herrlichkeit.
  5: Die Stimme des Herrn, der Zedern zerschmettert; ja, der Herr zerschmettert die
    Zedern des Libanon
  6: und zerschlägt sie wie ein junges Rind auf dem Libanon; er, der Geliebte, gleicht
    einem jungen Einhorn.
  7: Die Stimme des Herrn, der die Feuerflammen zerteilt; die Stimme des Herrn, der
    die Wüste erschüttert, und der Herr macht die Wüste Kades erbeben.
  8: 'Die Stimme des Herrn, der die Hindinnen gebären lässt und die dichten Wälder
    lichtet, und in seinem Tempel sprechen alle: Herrlichkeit!'
  9: Die Wasserflut macht der Herr zur Wohnung sich, dort thront der Herr als König
    in Ewigkeit.
  10: Der Herr wird seinem Volke Kraft verleihen, der Herr wird sein Volk mit Frieden
    segnen.
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
