# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 29
verses:
  1: Ich will dich erheben, o Herr! denn du hast mich beschirmt und hast meine Feinde
    sich nicht freuen lassen über mich.
  2: O Herr, mein Gott! zu dir rief ich und du heiltest mich.
  3: Herr! du hast meine Seele aus dem Totenreiche emporgeführt, hast mich von denen,
    die in die Grube hinabfahren, gerettet.
  4: Lobsinget dem Herrn, ihr seine Heiligen! und preiset sein geheiligtes Andenken.
  5: Denn er straft in seinem Grimme und gibt Leben durch sein Wohlwollen.
  6: Am Abende kehrt Weinen ein und am Morgen Freude.
  7: 'Ich aber sprach in meines Glückes Fülle: Nimmermehr werde ich wanken!'
  8: O Herr! durch dein Wohlwollen hattest du meiner Herrlichkeit Kraft verliehen.
  9: Du wandtest dein Angesicht von mir ab und ich ward bestürzt.
  10: 'Zu dir, o Herr! rief ich und zu meinem Gott flehte ich:'
  11: Welchen Nutzen hast du von meinem Blute, wenn ich zur Verwesung hinabfahre?
  12: Wird wohl der Staub dich loben oder deine Treue verkünden?
  13: Der Herr hat es gehört und sich meiner erbarmt, der Herr ist mein Helfer geworden!
  14: Du hast mir meine Klagen in Freude verwandelt, mein Trauerkleid gelöst und mich
    mit Freude umgürtet,
  15: auf dass dir meine Herrlichkeit lobsinge und ich kein Leid habe; o Herr, mein
    Gott immerdar will ich dich preisen!
  16: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  17: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
