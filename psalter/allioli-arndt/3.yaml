# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen und auf
# die Versgrenzen des gesungenen Psalters ausgerichtet (Issue #1). Diese
# Ausrichtung ist direkt (Wortfolge identisch, Verszahl stimmt ueberein).
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 3
verses:
  1: O Herr, wie sind meiner Bedränger viele geworden! Viele erheben sich wider mich.
  2: 'Viele sagen zu meiner Seele: Es gibt kein Heil für ihn bei seinem Gott!'
  3: Du aber, Herr! bist mein Beschützer, bist mein Ruhm und richtest mein Haupt empor.
  4: Mit lauter Stimme rief ich zum Herrn und er erhörte mich von seinem heiligen
    Berge.
  5: Ich legte mich nieder und entschlief und ich stand wieder auf, denn der Herr
    beschirmte mich.
  6: Nicht fürchte ich Tausende von Kriegsvolk, das mich umringt; erhebe dich, Herr!
    rette mich, o mein Gott!
  7: Denn du schlägst alle, die mir ohne Ursache feindlich gesinnt sind, zerschmetterst
    die Zähne der Sünder.
  8: Von dem Herrn kommt Heil und auf deinem Volke ruht dein Segen.
  9: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  10: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
