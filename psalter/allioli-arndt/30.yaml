# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 30
verses:
  1: Auf dich, o Herr! vertraue ich, lass mich nimmermehr zuschanden werden; nach
    deiner Gerechtigkeit befreie mich!
  2: Neige dein Ohr zu mir, eile, mich zu retten!
  3: Sei mir ein schirmender Gott und eine Stätte der Zuflucht, dass du mich errettest!
  4: Denn du bist meine Stärke und meine Zuflucht, und um deines Namens willen wirst
    du mich leiten und nähren.
  5: Du wirst mich aus der Schlinge ziehen, die sie mir heimlich gelegt haben; denn
    du bist mein Beschirmer.
  6: In deine Hände befehle ich meinen Geist; du hast mich erlöst, o Herr, Gott der
    Wahrhaftigkeit!
  7: Du hassest die, welche vergeblich sich an Nichtiges halten;
  8: Ich aber vertraue auf den Herrn. Ich will frohlocken und mich freuen deines Erbarmens,
  9: denn du hast meine Erniedrigung angesehen und meine Seele aus den Nöten errettet.
  10: Du hast mich nicht gänzlich in die Hände des Feindes übergeben, hast meine Füße
    auf weiten Raum gestellt.
  11: Erbarme dich meiner, o Herr! denn ich bin bedrängt; verstört ist vom Grame mein
    Auge, meine Seele und mein Leib.
  12: Denn mein Leben ist im Schmerze dahingeschwunden und meine Jahre im Seufzen.
  13: Geschwächt ist durch Elend meine Kraft und meine Gebeine sind erschüttert.
  14: Um aller meiner Feinde willen bin ich eine Schmach geworden für meine Nachbarn
    gar sehr und ein Schrecken meinen Bekannten.
  15: Die mich sahen, flohen vor mir davon. Vergessen bin ich, einem Toten gleich,
    aus dem Herzen geschwunden;
  16: einem zerbrochenen Gefäße gleichgeworden. Denn ich muss die Schmähung vieler
    hören, die mich ringsum umgeben.
  17: Indem sie zumal wider mich zusammenkamen, hielten sie Rat, mir das Leben zu
    rauben.
  18: 'Ich aber vertraue auf dich, o Herr! ich spreche: Mein Gott bist du! In deiner
    Hand steht mein Geschick.'
  19: Errette mich aus der Gewalt meiner Feinde und von meinen Verfolgern!
  20: Lass dein Angesicht über deinen Diener leuchten, errette mich durch deine Erbarmung.
    O Herr! lass mich nicht zuschanden werden, denn ich rufe dich an.
  21: Mögen die Gottlosen zuschanden werden und mögen sie in das Totenreich hinabgestoßen
    werden; mögen die trügerischen Lippen verstummen,
  22: die wider den Gerechten Unrecht reden in Hochmut und Verachtung.
  23: Wie groß ist die Fülle deiner Güte, o Herr! die du denen, die dich fürchten,
    aufbewahrst.
  24: Du erweisest sie denen, die auf dich vertrauen, vor den Menschenkindern.
  25: Du verbirgst sie mit dem Schirme deines Angesichts vor dem Schrecken der Menschen.
  26: Du schirmst sie wie in deinem Gezelte vor dem Hader ihrer Zungen.
  27: Gepriesen sei der Herr! denn er hat mir seine Barmherzigkeit wunderbar erwiesen
    in einer festen Stadt.
  28: 'In der Bestürzung meines Geistes zwar sprach ich: Ich bin verstoßen aus deinen
    Augen!'
  29: Doch darum hast du mein lautes Flehen erhört, als ich zu dir rief.
  30: Liebet den Herrn, ihr seine Heiligen alle! denn Wahrhaftigkeit sucht der Herr,
    und vergilt in vollem Maße denen, die Hochmut üben.
  31: Handelt mannhaft und lasset euer Herz stark sein, ihr alle, die ihr auf den
    Herrn hoffet!
  32: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  33: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
