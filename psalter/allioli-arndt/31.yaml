# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 31
verses:
  1: Glückselig diejenigen, deren Missetaten vergeben und deren Sünden bedeckt sind!
  2: Glückselig der Mann, dem der Herr seine Verschuldung nicht zurechnet und in dessen
    Geist kein Falsch ist!
  3: Weil ich schwieg, welkten meine Gebeine, während ich den ganzen Tag schrie.
  4: Denn Tag und Nacht lag deine Hand schwer auf mir; in meinem Elende kehrte ich
    mich zu dir, während der Stachel in mir haftete.
  5: Ich bekannte dir mein Vergehen und verbarg meine Ungerechtigkeit nicht.
  6: 'Ich sprach: Ich will wider mich dem Herrn mein Unrecht bekennen, und du vergabst
    mir den Frevel meiner Sünde.'
  7: Darum soll jeder Heilige zu dir flehen zu günstiger Zeit.
  8: Und ob auch viele Wasser einherfluten, werden sie ihn doch nicht erreichen.
  9: Du bist meine Zuflucht in der Bedrängnis, die mich umgibt; du mein Frohlocken,
    rette mich vor denen, die mich umlagern.
  10: Ich will dir Einsicht geben und dich unterweisen über den Weg, den du wandeln
    sollst; ich will meine Augen auf dir ruhen lassen.
  11: Werdet nicht wie Pferd und Maultier, welche keinen Verstand haben.
  12: Mit Zaum und Gebiss schnüre die Backen derer zusammen, die dir sonst nicht nahen.
  13: Viele Geißeln kommen über den Sünder; wer aber auf den Herrn vertraut, den umgibt
    er mit Gnade.
  14: Freuet euch in dem Herrn und frohlocket, ihr Gerechten, und jubelt alle, die
    ihr aufrichtigen Herzens seid!
  15: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  16: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
