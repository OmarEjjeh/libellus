psalmus: 33
verses:
  1: Ich will den Herrn preisen alle Zeit, immerdar soll sein Lob in meinem Munde
    sein.
  2: Im Herrn soll meine Seele sich rühmen, es mögen es die Sanftmütigen hören und
    sich freuen.
  3: Verherrlichet den Herrn mit mir, lasset uns miteinander seinen Namen erheben!
  4: Ich habe den Herrn gesucht und er erhörte mich, und aus allen meinen Bedrängnissen
    rettete er mich.
  5: Tretet hin zu ihm, so werdet ihr licht und euer Angesicht wird nicht beschämt
    werden.
  6: Dieser Arme rief und der Herr erhörte ihn und errettete ihn aus allen seinen
    Bedrängnissen.
  7: Der Engel des Herrn lagert sich um die, so ihn fürchten, und rettet sie.
  8: Kostet und sehet, dass der Herr gütig ist; glückselig der Mann, der auf ihn hofft!
  9: Fürchtet den Herrn, ihr seine Heiligen alle! denn die ihn fürchten, trifft kein
    Mangel.
  10: Reiche darben und leiden Hunger; doch die den Herrn suchen, haben keinen Mangel
    an irgend einem Gute.
  11: Kommet, Kinder! höret auf mich, ich will euch die Furcht des Herrn lehren.
  12: Wer ist der Mann, der Leben begehrt und gute Tage zu schauen verlangt?
  13: Wahre deine Zunge vor Bösem und deine Lippen, dass sie nicht Trug reden.
  14: Halte dich fern vom Bösen und tue Gutes, suche Frieden und jage ihm nach!
  15: Die Augen des Herrn sind auf die Gerechten gerichtet und seine Ohren hören auf
    ihr Flehen.
  16: Doch der Herr wendet sein Antlitz wider die, welche Böses tun, um ihr Gedächtnis
    von der Erde zu vertilgen.
  17: Die Gerechten rufen und der Herr erhört sie und rettet sie aus allen ihren Drangsalen.
  18: Der Herr ist denen nahe, welche bedrängten Herzens sind, und hilft denen, die
    gebeugten Geistes sind.
  19: Zahlreiche Drangsale kommen über die Gerechten, aber der Herr rettet sie aus
    allen.
  20: Der Herr behütet alle ihre Gebeine, nicht eines derselben wird zerbrochen.
  21: Der Tod der Sünder ist unheilvoll und die den Gerechten hassen, begehen Sünde.
  22: Der Herr erlöst die Seelen seiner Diener; und alle, die auf ihn vertrauen, werden
    nicht in Versündigung fallen.
  23: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  24: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
