# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 34
verses:
  1: Richte, Herr! die mir unrecht tun; bezwinge, die wider mich kämpfen.
  2: Ergreife Waffen und Schild und erhebe dich, mir zu helfen!
  3: 'Ziehe das Schwert und versperre den Weg denen, die mich verfolgen; sprich zu
    meiner Seele: Ich bin dein Heil!'
  4: Beschämt und zuschanden mögen werden, die mir nach dem Leben trachten.
  5: Es mögen zurückweichen und zuschanden werden, die wider mich Böses sinnen.
  6: Sie mögen werden wie Staub vor dem Winde und der Engel des Herrn bedränge sie.
  7: Ihr Weg werde finster und schlüpfrig und der Engel des Herrn verfolge sie.
  8: Denn ohne Ursache haben sie mir heimlich ihren verderbenbringenden Fallstrick
    gelegt, haben mir Schmach angetan ohne Grund.
  9: Es komme unversehens über ihn der Fallstrick und das Netz, das er heimlich gelegt,
    fange ihn und in seine eigene Schlinge möge er stürzen.
  10: Meine Seele aber wird in dem Herrn frohlocken und sich über seine Hilfe freuen.
  11: 'Alle meine Gebeine werden sprechen: O Herr! wer ist dir gleich?'
  12: Der du den Hilflosen aus der Hand derer errettest, die stärker sind als er,
    den Armen und Dürftigen aus der Hand derer, die ihn berauben.
  13: Es treten ungerechte Zeugen auf und man befragt mich über das, wovon ich nichts
    weiß.
  14: Sie vergelten mir Böses für Gutes, machen meine Seele trostlos.
  15: Ich aber tat ein Bußkleid an, als ihr Leid mich drückte.
  16: Ich kasteite mich mit Fasten und mein Gebet kehrte zurück in meinen Busen.
  17: Wie unserm nächsten Freunde und unserem Bruder war ich ihnen zu Willen; wie
    einer, der trauert und betrübt ist, so war ich gebeugt.
  18: Und sie freuen sich wider mich und rotten sich zusammen; man häuft Geißeln über
    mich, wenn ich es nicht vermute.
  19: Sie wurden getrennt, doch nicht reuig; sie stellen mich auf die Probe, überhäufen
    mich mit Hohn, sie knirschen wider mich mit ihren Zähnen.
  20: O Herr! wann wirst du herblicken? Befreie meine Seele von ihrer Bosheit, meine
    Verlassene von den Löwen.
  21: Ich will dir lobsingen in großer Versammlung, unter zahlreichem Volke dich rühmen.
  22: Nicht mögen sich freuen über mich die, welche mir feind sind mit Unrecht, die
    mich ohne Ursache hassen und mit den Augen zwinkern.
  23: Denn reden sie auch friedlich mit mir, so sinnen sie doch auf Trug im Zorne
    irdischer Menschen.
  24: 'Sie sperren ihren Mund weit auf wider mich und rufen: Ha, ha, unser Auge hat
    es gesehen.'
  25: Du hast es gesehen, o Herr! so schweige nicht; Herr, sei nicht fern von mir!
  26: Erhebe dich und habe acht auf mein Recht, mein Gott und mein Herr! auf meine
    Sache.
  27: Schaffe mir Recht nach deiner Gerechtigkeit, Herr, mein Gott! dass jene nicht
    frohlocken über mich.
  28: 'Dass sie nicht in ihren Herzen sagen: Ha, ha! welche Lust für unser Herz! Dass
    sie nicht sagen: Wir haben ihn verschlungen!'
  29: Es mögen schamrot und beschämt werden allzumal, die ob meines Unglücks frohlocken.
  30: Mit Schmach und Schande mögen bedeckt werden, die über mich prahlen.
  31: 'Frohlocken und sich freuen mögen, die Gerechtigkeit für mich wollen; und die
    seinem Diener den Frieden wünschen, mögen immerdar sagen: Hochgelobt sei der Herr!'
  32: Und meine Zunge wird deine Gerechtigkeit verkünden, allezeit dein Lob.
  33: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  34: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
