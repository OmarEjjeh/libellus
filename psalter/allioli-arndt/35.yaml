# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 35
verses:
  1: Es beschließt der Gottlose bei sich, zu sündigen; Furcht Gottes ist nicht vor
    seinen Augen.
  2: Denn trüglich handelt er vor dessen Angesichte, so dass sein Frevel hassenswert
    erscheint.
  3: Die Worte seines Mundes sind Frevel und Trug; er will nicht klug werden, um Gutes
    zu tun.
  4: Frevel sinnt er auf seinem Lager; er tritt auf jeden nicht guten Weg, das Böse
    hasst er nicht.
  5: O Herr! bis an den Himmel reicht deine Gnadenhuld und deine Treue bis an die
    Wolken.
  6: Deine Gerechtigkeit ist wie die Berge Gottes, deine Gerichte wie eine große Tiefe;
  7: Menschen und Vieh hilfst du, o Herr! Wie vielfältig ist dein Erbarmen, o Gott!
  8: Die Menschenkinder bergen sich in Zuversicht unter dem Schatten deiner Flügel.
  9: Sie laben sich reichlich von der Überfülle deines Hauses und du tränkst sie mit
    dem Strome deiner Wonne.
  10: Denn bei dir ist die Quelle des Lebens und in deinem Lichte schauen wir Licht.
  11: Lass dein Erbarmen schauen über die, welche dich kennen, und deine Gerechtigkeit
    über die, welche aufrichtigen Herzens sind.
  12: Nicht komme der Fuß der Hoffart über mich und die Hand des Sünders erschüttere
    mich nicht!
  13: Siehe da, gefallen sind, die Unrecht tun; sie sind hinausgestoßen und können
    sich nicht erheben.
  14: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  15: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
