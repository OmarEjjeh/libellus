# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 36
verses:
  1: Erzürne dich nicht über die Bösen und ereifere dich nicht über die, welche Frevel
    verüben!
  2: Denn wie Gras verdorren sie schnell und wie grünes Kraut welken sie bald dahin.
  3: Hoffe auf den Herrn und tue Gutes, wohne im Lande und genieße seine Reichtümer.
  4: Habe deine Freude an dem Herrn, so wird er dir geben, was dein Herz verlangt.
  5: Befiehl dem Herrn deine Wege und hoffe auf ihn, so wird er es wohl machen.
  6: Und er wird deine Gerechtigkeit ausgehen lassen wie das Licht und dein Recht
    wie die Mittagshelle. Sei dem Herrn untergeben und bete zu ihm.
  7: Ereifere dich nicht über den, der glücklich ist auf seinem Wege, über den Mann,
    der Unrecht tut.
  8: Stehe ab vom Zorne und lass den Groll fahren; ereifere dich nicht, so dass auch
    du Böses tuest.
  9: Denn die Übeltäter werden ausgerottet, die aber, welche auf den Herrn harren,
    werden das Land ererben.
  10: Noch eine kleine Weile und der Sünder ist nicht mehr; suchst du nach seiner
    Stätte, so findest du sie nicht.
  11: Die Sanftmütigen aber werden das Land ererben und in der Fülle des Friedens
    ihre Wonne haben.
  12: Der Sünder schaut lauernd auf den Gerechten und knirscht über ihn mit seinen
    Zähnen.
  13: Der Herr aber lacht seiner; denn er sieht voraus, dass dessen Tag kommen wird.
  14: Die Sünder ziehen das Schwert, spannen ihren Bogen,
  15: um den Armen und Hilflosen zu stürzen, um hinzuschlachten die, welche geraden
    Herzens sind.
  16: Ihr Schwert möge ihr eigenes Herz durchbohren und ihr Bogen möge zerbrochen
    werden!
  17: Das wenige, das der Gerechte hat, ist ihm besser als der Sünder große Schätze.
  18: Denn die Arme der Sünder werden gebrochen, aber die Gerechten stützt der Herr.
  19: Der Herr kennt die Tage der Makellosen und ihr Erbe bleibt in Ewigkeit.
  20: Sie werden nicht zuschanden in böser Zeit und in den Tagen des Hungers werden
    sie gesättigt. Denn die Sünder gehen zugrunde
  21: und die Feinde des Herrn schwinden hin, kaum dass sie zu Ehren und Ansehen gekommen
    sind; wie der Rauch schwinden sie dahin.
  22: Der Sünder borgt und kann nicht bezahlen, der Gerechte aber erbarmt sich und
    teilt aus.
  23: Denn die ihn segnen, werden das Land erben; die ihm aber fluchen, werden zugrunde
    gehen.
  24: Von dem Herrn werden des Menschen Schritte geleitet und an seinem Wandel hat
    er Wohlgefallen.
  25: Wenn er auch fällt, so wird er nicht Schaden nehmen, denn der Herr hält ihn
    mit seiner Hand.
  26: Ich bin jung gewesen und bin alt geworden und nie habe ich den Gerechten verlassen
    gesehen oder seine Kinder um Brot betteln.
  27: Allezeit ist er mildtätig und leiht und seine Nachkommenschaft ist gesegnet.
  28: Halte dich fern vom Bösen und tue Gutes und wohne alsdann immerdar im Lande.
  29: Denn der Herr liebt das Recht und verlässt seine Heiligen nicht, immerdar werden
    sie behütet;
  30: die Ungerechten werden gestraft und die Nachkommenschaft der Gottlosen geht
    zugrunde.
  31: Doch die Gerechten werden das Land ererben und auf immer darin wohnen.
  32: Der Mund des Gerechten spricht besonnene Weisheit und seine Zunge redet, was
    recht ist.
  33: Das Gesetz seines Gottes ist in seinem Herzen und seine Schritte wanken nicht.
  34: Der Sünder lauert dem Gerechten auf und trachtet darnach, ihn zu töten,
  35: doch der Herr lässt ihn nicht in seiner Gewalt und lässt ihn nicht verdammen,
    wenn auch mit ihm gerechtet wird.
  36: Harre auf den Herrn und beobachte seinen Weg, so wird er dich erhöhen, dass
    du das Land zum Erbe erhaltest; du wirst zusehen, wenn die Sünder zugrunde gehen.
  37: Ich sah einen Gottlosen hoch erhöht und hoch geworden wie die Zedern des Libanon.
  38: Als ich aber vorüberging, siehe, da war er nicht mehr; ich suchte ihn und seine
    Stätte war nicht zu finden.
  39: Bewahre die Unschuld und siehe auf das, was recht ist, denn dem Manne des Friedens
    sind Nachkommen beschieden.
  40: Die Ungerechten aber kommen allzumal um, die Nachkommenschaft der Gottlosen
    geht zugrunde.
  41: Doch den Gerechten kommt Heil von dem Herrn, er ist ihr Beschirmer zur Zeit
    der Bedrängnis.
  42: Und der Herr hilft ihnen, befreit sie, rettet sie vor den Sündern und steht
    ihnen bei, denn sie haben auf ihn gehofft.
  43: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  44: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
