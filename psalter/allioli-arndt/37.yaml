# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 37
verses:
  1: O Herr! straf mich nicht in deinem Grimme und züchtige mich nicht in deinem Zorne,
  2: denn deine Pfeile stecken tief in mir und schwer hast du deine Hand auf mich
    gelegt.
  3: Nichts blieb unversehrt an meinem Leibe vor deinem Zorne, kein Frieden ist in
    meinen Gebeinen ob meiner Sünden.
  4: Denn meine Verschuldungen übersteigen mein Haupt und lasten gleich einer schweren
    Bürde auf mir.
  5: Meine Wunden infolge meiner Torheit sind faul und eitern.
  6: Ich bin elend geworden und überaus gebeugt, den ganzen Tag gehe ich trauernd
    einher.
  7: Denn voll von Täuschung sind meine Lenden und nichts Gesundes ist an meinem Fleische.
  8: Ich bin überaus bedrängt und niedergebeugt, ich schreie laut auf ob des Kummers
    meines Herzens.
  9: O Herr! dir ist all mein Sehnen offenbar und mein Seufzen ist dir nicht verborgen.
  10: Mein Herz ist verwirrt, meine Kraft hat mich verlassen und selbst das Licht
    meiner Augen ist nicht mehr bei mir.
  11: Meine Freunde und meine Nächsten nahten sich wider mich und blieben stehen,
  12: und die mir nahe waren, hielten sich fern; und die mir nach dem Leben trachteten,
    wendeten Gewalt an;
  13: die mir Böses wünschten, redeten Eitles und sprachen Trug immerfort.
  14: Ich aber hörte nicht, einem Tauben gleich, und war wie ein Stummer, der seinen
    Mund nicht auftut.
  15: Ich ward wie ein Mensch, der nicht hört und der keine Widerrede in seinem Munde
    hat.
  16: Denn auf dich, o Herr! vertraue ich; du wirst mich erhören, o Herr, mein Gott!
  17: 'Denn ich sprach: Mögen meine Feinde nicht frohlocken über mich! denn wenn meine
    Füße wanken, werden sie groß sprechen über mich.'
  18: Denn ich bin der Geißelstreiche gewärtig und mein Schmerz ist allezeit vor mir.
  19: Ich will meine Missetaten kundgeben und meiner Sünde wegen Sorge hegen.
  20: Meine Feinde aber leben und sind mächtiger geworden als ich und zahlreich sind,
    die mich ungerecht hassen.
  21: Indem sie Gutes mit Bösem vergelten, reden sie mir übel nach, weil ich dem Guten
    nachstrebe.
  22: Verlass mich nicht, Herr, mein Gott! entferne dich nicht von mir.
  23: Habe acht auf meine Hilfe, o Herr, du Gott meines Heiles!
  24: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  25: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
