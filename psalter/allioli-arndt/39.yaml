# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 39
verses:
  1: Sehnsüchtig harrte ich auf den Herrn und er merkte auf mich.
  2: Und er erhörte mein Gebet und zog mich heraus aus der Grube des Elends, aus schlammigem
    Kote
  3: und stellte meine Füße auf Felsengrund und machte meine Schritte sicher.
  4: Und er gab mir ein neues Lied in meinen Mund, einen Lobgesang auf unsern Gott.
  5: Viele werden es sehen und sich fürchten und auf den Herrn ihr Vertrauen setzen.
  6: Glückselig der Mann, der seine Hoffnung auf den Namen des Herrn setzt und seinen
    Blick nicht auf Eitles wendet und auf trügerischen Aberwitz.
  7: Viele Wunder hast du getan, o Herr, mein Gott! und niemand ist, der dir gleich
    wäre in deinen Gedanken.
  8: Wollte ich sie verkünden und von ihnen reden, so sind ihrer zu viel, als dass
    ich sie aufzählen könnte.
  9: Nicht Schlachtopfer und Speiseopfer hast du verlangt, doch Ohren hast du mir
    bereitet;
  10: 'Brandopfer und Sündopfer begehrst du nicht. Da sprach ich: Siehe, ich komme!'
  11: In der Buchrolle ist von mir geschrieben, ich komme, deinen Willen zu tun. Mein
    Gott! ich will es und dein Gesetz ist in meines Herzens Mitte.
  12: Ich verkünde deine Gerechtigkeit in großer Versammlung, siehe, ich wehre meinen
    Lippen nicht. Herr! du weißt es.
  13: Deine Gerechtigkeit habe ich nicht in meinem Herzen verborgen, deine Wahrhaftigkeit
    und dein Heil habe ich gepriesen.
  14: Ich habe deine Barmherzigkeit und deine Wahrhaftigkeit nicht verborgen vor zahlreicher
    Versammlung.
  15: Du aber, Herr! lass deine Erbarmungen nicht fern sein von mir, dein Erbarmen
    und deine Treue werden mich immerdar schützen.
  16: Denn Übel ohne Zahl halten mich umgeben, meine Sünden haben mich ergriffen und
    ich vermag nicht mehr zu sehen.
  17: Sie sind zahlreicher als die Haare meines Hauptes und mein Mut hat mich verlassen.
  18: Lass es dir gefallen, o Herr! mich zu erretten, o Herr! habe acht, mir zu helfen.
  19: Es sollen schamrot und zuschanden werden allzumal, die mir nach dem Leben trachten,
    um es wegzuraffen.
  20: Es mögen zurückweichen und beschämt werden, die mir Übles wollen.
  21: 'Es mögen alsbald ihre Schande tragen, die zu mir sagen: Ha, ha!'
  22: 'Frohlocken mögen und sich freuen über dich alle, die dich suchen, und die deine
    Hilfe lieben, mögen immerdar rufen: Hochgelobt sei der Herr!'
  23: Ich aber, bin ich auch ein Bettler und armselig, so ist doch der Herr für mich
    besorgt.
  24: Du bist mein Helfer und mein Beschirmer, mein Gott, säume nicht!
  25: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  26: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
