# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 4
verses:
  1: Wenn ich rufe, erhört mich der Gott meiner Gerechtigkeit, aus der Drangsal schaffst
    du mir Befreiung.
  2: Erbarme dich meiner und erhöre mein Gebet!
  3: Ihr Menschenkinder! wie lange bleibt noch euer Herz verhärtet? Warum liebt ihr
    Eitles und sinnet auf Lüge?
  4: Wisset, dass der Herr Wunder getan an seinem Heiligen, der Herr wird mich erhören,
    wenn ich zu ihm rufe.
  5: Wenn ihr zürnt, so sündiget nicht; was ihr in euren Herzen sprecht, bereuet auf
    eurer Lagerstatt.
  6: 'Bringet rechte Opfer und vertrauet auf den Herrn! Viele sagen: Wer wird uns
    Gutes schauen lassen?'
  7: Es strahlt wie ein Panier über uns die Leuchte deines Angesichtes, o Herr! du
    gibst mir Freude in mein Herz.
  8: Sie wurden reich von der Frucht des Getreides, des Weines und Öles.
  9: In Frieden zumal lege ich mich nieder und ruhe,
  10: denn du, o Herr! hast mich vollkommen fest gestellt in Zuversicht.
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
