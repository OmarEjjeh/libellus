# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 41
verses:
  1: Wie ein Hirsch nach Wasserquellen lechzt, so lechzt meine Seele nach dir, o Gott!
  2: Meine Seele dürstet nach Gott, dem Starken, dem Lebendigen; wann werde ich hingelangen
    und vor Gottes Angesicht erscheinen?
  3: 'Meine Tränen wurden mir zur Speise Tag und Nacht, da man Tag um Tag zu mir sagte:
    Wo ist dein Gott?'
  4: Dessen bin ich eingedenk und lasse mein Herz in Schmerz zerfließen, dass ich
    wandeln möchte zur Stätte des wunderbaren Zeltes, hinan zum Hause Gottes.
  5: Unter Jauchzen und Lobgesang und Festesjubel.
  6: Warum bist du so traurig, meine Seele, und warum verwirrst du mich?
  7: Hoffe auf Gott, denn ich werde ihn noch preisen, meines Angesichtes Heil und
    mein Gott.
  8: Meine Seele ist verwirrt in mir, darum gedenke ich deiner vom Jordanlande und
    vom Hermon her, dem kleinen Berg.
  9: Eine Flut ruft die andere beim Rauschen deiner Wasserfälle.
  10: Alle deine hohen Wogen und deine Fluten stürmten über mich dahin.
  11: Am Tage entbietet mir der Herr seine Huld und des Nachts Lobgesang auf ihn.
  12: 'Innerliches Gebet zu dem Gott meines Lebens. Ich spreche zu Gott: O du, mein
    Helfer.'
  13: Warum hast du mein vergessen? Und warum muss ich traurig einhergehen, indes
    mich der Feind bedrängt?
  14: Indes meine Gebeine zermalmt werden, da mich meine Feinde schmähen, die mich
    bedrängen.
  15: 'Indem sie mir alle Tage sagen: Wo ist dein Gott? Warum bist du traurig, meine
    Seele, und warum verwirrst du mich?'
  16: Hoffe auf Gott, denn ich werde ihn noch preisen, er ist das Heil meines Angesichtes
    und mein Gott!
  17: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  18: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
