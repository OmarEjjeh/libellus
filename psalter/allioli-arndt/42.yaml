# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 42
verses:
  1: Schaffe mir Recht, o Gott! und entscheide meine Sache gegen ein unheiliges Volk,
    von dem Manne des Unrechtes und des Truges rette mich.
  2: Denn du, o Gott! bist meine Stärke; warum hast du mich verstoßen? Und warum muss
    ich trauernd einhergehen, da der Feind mich bedrängt?
  3: Sende dein Licht und deine Wahrheit aus, sie sollen mich leiten und hinführen
    zu deinem heiligen Berge und zu deinem Gezelte.
  4: Und ich werde hintreten zum Altare Gottes, zu Gott, der meiner Jugend Freude
    bereitet.
  5: Ich werde dir lobsingen auf der Harfe, o Gott, mein Gott! Warum bist du traurig,
    meine Seele, und warum verwirrst du mich?
  6: Hoffe auf Gott, denn ich werde ihn noch preisen; er ist das Heil meines Angesichtes
    und mein Gott.
  7: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  8: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
