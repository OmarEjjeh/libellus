# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 43
verses:
  1: O Gott! mit unsern Ohren haben wir gehört, unsere Väter haben uns erzählt.
  2: Die Großtaten, die du vollbracht in ihren Tagen und in den Tagen der Vorzeit.
  3: Deine Hand vertrieb die Völker und du pflanztest sie dafür ein, du züchtigtest
    die Völker, sie aber ließest du emporwachsen.
  4: Denn nicht durch ihr Schwert haben sie das Land in Besitz genommen und ihr Arm
    hat ihnen nicht Heil geschafft.
  5: Sondern deine Rechte und dein Arm und das Licht deines Angesichtes, denn du hattest
    an ihnen Wohlgefallen.
  6: Du bist ja mein König und mein Gott, der Heil entbietet in Jakob.
  7: Durch dich stoßen wir unsere Feinde nieder und durch deinen Namen verachten wir
    die, welche sich wider uns erheben.
  8: Denn nicht auf meinen Bogen setze ich mein Vertrauen und mein Schwert kann mir
    nicht Rettung bringen,
  9: sondern du befreist uns von unsern Drängern und machst die zuschanden, die uns
    hassen.
  10: Gottes rühmen wir uns allezeit und deinen Namen preisen wir ewiglich.
  11: Jetzt aber hast du uns verstoßen und zuschanden gemacht und ziehest, o Gott!
    nicht aus mit unsern Heeren.
  12: Du lässest uns zurückweichen vor unsern Feinden, und die uns hassen, haben sich
    Beute gewonnen.
  13: Du gabst uns dahin wie Schlachtschafe und zerstreutest uns unter die Völker.
  14: Du hast dein Volk verkauft für nichts und es war kein Gewinn bei seiner Dahingabe.
  15: Du hast uns zum Gespött gemacht bei unsern Nachbarn, zum Spott und Gelächter
    bei denen, die um uns her sind.
  16: Du machtest uns zum Sprichwort den Heiden, zum Gegenstand des Kopfschüttelns
    unter den Völkern.
  17: Den ganzen Tag steht meine Schmach vor mir und Schamröte bedeckt mein Angesicht
  18: ob der Stimme des Höhnenden und Beschimpfenden, im Angesichte des Feindes und
    Verfolgers.
  19: Dies alles ist über uns gekommen, obschon wir deiner nicht vergessen und nicht
    treulos gehandelt hatten an deinem Bunde.
  20: Unser Herz ist nicht zurückgewichen, dennoch ließest du unsere Pfade von deinem
    Wege abweichen.
  21: Denn du hast uns niedergebeugt an der Stätte der Trübsal und Todesschatten hat
    uns bedeckt.
  22: Wenn wir des Namens unsers Gottes vergessen und unsere Hände ausgestreckt hätten
    zu einem andern Gott,
  23: würde Gott dies nicht erforschen? Er kennt ja die Geheimnisse des Herzens.
  24: Um deinetwillen werden wir immerfort hingewürgt, werden geachtet wie Schlachtschafe.
  25: Wache auf! warum schläfst du, Herr? Wache auf und verwirf uns nicht auf immerdar!
  26: Warum wendest du dein Antlitz ab, vergissest unseres Elendes und unserer Drangsal?
  27: Denn bis zum Staube ist unsere Seele gebeugt, es klebt am Boden unser Leib.
  28: Erhebe dich, o Herr! hilf uns und erlöse uns um deines Namens willen.
  29: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  30: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
