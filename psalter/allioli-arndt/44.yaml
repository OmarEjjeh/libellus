# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 44
verses:
  1: Mein Herz strömt ein gutes Wort aus, dem Könige gilt mein Lied.
  2: Meine Zunge ist wie der Griffel des Schnellschreibers.
  3: Schön von Gestalt bist du, mehr als die Menschenkinder, Anmut ist ausgegossen
    über deine Lippen; darum hat dich Gott gesegnet auf ewig.
  4: Gürte dein Schwert um deine Hüfte, Gewaltigster!
  5: In deiner Wohlgestalt und deiner Schönheit ziehe aus, schreite glücklich fort
    und herrsche siegreich.
  6: Für Wahrheit, Sanftmut und Gerechtigkeit, und deine Rechte wird dich wunderbar
    leiten.
  7: Deine Pfeile sind scharf, Völker stürzen unter dir, sie dringen tief ins Herz
    der Feinde des Königs.
  8: Dein Thron, o Gott! steht festgegründet ewiglich, ein Zepter der Gerechtigkeit
    ist das Zepter deines Königtums.
  9: Du liebst Gerechtigkeit und hassest Unrecht, darum hat dich, Gott, dein Gott,
    mit Freudenöl gesalbt vor deinen Genossen.
  10: Es duften Myrrhe, Aloe und Kasia aus deinen Gewändern, aus Elfenbeinpalästen,
    von dort erfreuten dich die Königstöchter in deiner Herrlichkeit.
  11: Zu deiner Rechten steht die Königin in goldgewirktem Kleide, umgeben von bunter
    Pracht.
  12: Höre, o Tochter! und siehe und neige dein Ohr und vergiss dein Volk und dein
    Vaterhaus!
  13: Der König wird nach deiner Schönheit verlangen, denn er ist der Herr, dein Gott,
    und ihn wird man anbeten.
  14: Die Töchter von Tyrus werden sich mit Gaben um deine Gunst bemühen, alle Reichen
    des Volkes.
  15: Ganz Herrlichkeit ist die Königstochter im Innern, mit goldenem Saume geziert,
  16: ist sie mit bunten Kleidern angetan. Hinter ihr her werden Jungfrauen zu dem
    Könige geführt, ihre Genossinnen werden zu dir gebracht,
  17: unter Freude und Frohlocken werden sie herzugeführt, hineingeleitet in den Palast
    des Königs.
  18: An deiner Väter Statt werden dir Söhne geboren, du wirst sie zu Fürsten setzen
    über das ganze Land.
  19: Sie werden deines Namens gedenken von Geschlecht zu Geschlecht.
  20: Darum werden die Völker dich preisen immerdar und ewig.
  21: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  22: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
