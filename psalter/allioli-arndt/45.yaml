# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 45
verses:
  1: Gott ist unsere Zuflucht und Stärke, ein Helfer in Drangsalen, die uns hart betroffen.
  2: Darum fürchten wir uns nicht, wenn gleich die Erde erbebte und die Berge mitten
    ins Meer versetzt würden.
  3: Mögen seine Wasser toben und aufwallen und die Berge erbeben vor seiner Macht.
  4: Eines Stromes Wogendrang erfreut die Stadt Gottes, der Allerhöchste hält seine
    Wohnung geheiligt.
  5: Gott ist in ihrer Mitte, sie wird nicht wanken, frühe am Morgen hilft ihr Gott.
  6: Es tobten Völker, es wankten Reiche; er ließ seine Stimme erschallen und die
    Erde erbebte.
  7: Der Herr der Heerscharen ist mit uns; unser Schirm ist der Gott Jakobs.
  8: Kommet und schauet die Taten des Herrn, welche Wunder er auf Erden gewirkt hat!
    Der den Kriegen steuert bis ans Ende der Erde.
  9: Bogen zertrümmert und Waffen zerschlägt und Schilde in Feuer verbrennt.
  10: Lasset ab und sehet, dass ich Gott bin; ich bin erhaben unter den Völkern und
    erhaben auf Erden.
  11: Der Herr der Heerscharen ist mit uns, unser Schirm ist der Gott Jakobs.
  12: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  13: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
