# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen und auf
# die Versgrenzen des gesungenen Psalters ausgerichtet (Issue #1). Diese
# Ausrichtung ist direkt (Wortfolge identisch, Verszahl stimmt ueberein).
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 46
verses:
  1: Klatschet in die Hände, ihr Völker alle, jauchzet Gott zu mit Jubelschall!
  2: Denn der Herr, der Allerhöchste, ist furchtbar, ein großer König über die ganze
    Erde.
  3: Er zwang Völker unter unsere Macht und Nationen unter unsere Füße.
  4: Er hat für uns seinen Erbbesitz auserwählt, die Zierde Jakobs, die er liebt.
  5: Gott ist aufgefahren mit Jubelklang und der Herr mit Posaunenschall.
  6: Lobsinget unserm Gott, lobsinget; lobsinget unserm Könige, lobsinget!
  7: Denn Gott ist König über die ganze Erde, lobsinget mit Weisheit!
  8: Gott herrscht über die Völker, Gott sitzt auf seinem heiligen Throne.
  9: Die Fürsten der Völker versammeln sich um den Gott Abrahams, denn hoch erhoben
    sind die mächtigen Gewalthaber der Erde.
  10: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  11: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
