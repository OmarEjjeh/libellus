# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 47
verses:
  1: Groß ist der Herr und hoch zu preisen in der Stadt unsers Gottes auf seinem heiligen
    Berge.
  2: Fest steht gegründet zum Frohlocken der ganzen Erde der Berg Sion, die Seite
    gegen Mitternacht, die Stadt des großen Königs.
  3: Gott hat sich kundgegeben in ihren Häusern, da er ihr Beschützer ist.
  4: Denn siehe, die Könige der Erde scharten sich zusammen, vereinigten sich miteinander.
  5: Als sie solches schauten, erstaunten sie, wurden bestürzt und bebten, Schrecken
    erfasste sie.
  6: Da trafen sie Schmerzen, wie die einer Gebärenden. In heftigem Sturme zertrümmertest
    du die Tharsis-Schiffe.
  7: 'Wie wir es vernommen, so sahen wir es in der Stadt des Herrn der Heerscharen,
    in der Stadt unsers Gottes: Gott hat sie auf ewig gefestigt.'
  8: Wir preisen deine Gnade, o Gott! inmitten deines Tempels.
  9: Wie dein Name, o Gott! also erschallt auch dein Lobpreis bis an die Enden der
    Erde, voll Gerechtigkeit ist deine Rechte.
  10: Es freue sich der Berg Sion und die Töchter Judas mögen frohlocken, um deiner
    Gerichte willen, o Herr!
  11: Gehet herum um Sion und umwandelt es ringsum, preiset es in seinen Türmen!
  12: Richtet eure Herzen auf seine Stärke und zählet einzeln seine Häuser, auf dass
    ihr es dem kommenden Geschlechte verkündet,
  13: dass hier Gott wohnt, unser Gott auf immer und ewig; er wird uns leiten immerdar.
  14: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  15: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
