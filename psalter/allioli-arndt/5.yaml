# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 5
verses:
  1: Lass, o Herr! meine Worte zu deinen Ohren dringen, vernimm mein Rufen!
  2: Merke auf mein flehentliches Gebet, o mein König und mein Gott!
  3: Denn ich bete zu dir, o Herr! früh am Morgen erhörst du mein Rufen.
  4: Früh am Morgen stehe ich vor dir und schaue aus, denn du bist kein Gott, der
    Unrecht liebt.
  5: Und der Frevler darf nicht bei dir weilen noch bestehen die Ungerechten vor deinen
    Augen.
  6: Du hassest alle, die Böses tun, vertilgst alle, die Lügen reden.
  7: Den Mann des Blutes und des Truges verabscheut der Herr. Ich aber werde ob der
    Fülle deiner Barmherzigkeit,
  8: in dein Haus kommen, anbeten gegen deinen heiligen Tempel hin in Furcht vor dir.
  9: Herr! leite mich in deiner Gerechtigkeit, um meiner Feinde willen führe mich
    auf geradem Wege vor dir.
  10: Denn keine Wahrhaftigkeit ist in ihrem Munde, ihr Herz ist eitel.
  11: Ein offenes Grab ist ihr Schlund, mit ihren Zungen üben sie Trug, gehe ins Gericht
    mit ihnen, o Gott!
  12: Lass sie mit ihren Anschlägen zu Falle kommen, verstoße sie ob der Menge ihrer
    Missetaten, denn sie haben dich zum Zorne gereizt, o Herr!
  13: Und es sollen sich alle freuen, die auf dich vertrauen, sie werden frohlocken
    immerdar und du wirst unter ihnen wohnen.
  14: Und es werden sich rühmen in dir alle, die deinen Namen lieben, denn du segnest
    den Gerechten.
  15: O Herr! wie mit einem Schilde umgibst du uns mit deiner Huld.
  16: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  17: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
