# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 51
verses:
  1: Was rühmst du dich in der Bosheit, der du mächtig bist in der Ungerechtigkeit?
  2: Den ganzen Tag sinnt deine Zunge Frevel, wie ein scharfes Schermesser übst du
    Trug.
  3: Du liebst das Böse mehr als das Gute, redest lieber Unrecht, als was billig ist.
  4: Du liebst nur verderbliche Reden, trügerische Zunge!
  5: Darum wird dich Gott ganz und gar vernichten, dich hinwegraffen und dich vertreiben
    aus deinem Gezelte und deine Wurzel herausreißen aus dem Lande der Lebendigen.
  6: 'Die Gerechten werden es sehen und sich fürchten und ihn verlachen und sagen:
    Sehet da den Mann, der Gott nicht zu seinem Helfer machte.'
  7: Sondern auf die Menge seines Reichtums vertraute und sich stark dünkte in dem,
    was eitel war.
  8: Ich aber bin im Hause Gottes wie ein fruchtbarer Ölbaum, ich hoffe auf das Erbarmen
    Gottes immer und ewig.
  9: Ich will dich immerdar preisen, weil du es getan hast, und will auf deinen Namen
    hoffen, denn er ist gütig angesichts deiner Heiligen.
  10: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  11: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
