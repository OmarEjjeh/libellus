# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen und auf
# die Versgrenzen des gesungenen Psalters ausgerichtet (Issue #1). Diese
# Ausrichtung ist direkt (Wortfolge identisch, Verszahl stimmt ueberein).
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 53
verses:
  1: O Gott! durch deinen Namen errette mich und durch deine Kraft schaffe mir Recht!
  2: Erhöre mein Gebet, o Gott! vernimm die Worte meines Mundes.
  3: Denn Fremdlinge haben sich erhoben wider mich und Gewalttätige trachten mir nach
    dem Leben und stellen sich Gott nicht vor Augen.
  4: Denn siehe, Gott steht mir bei und der Herr ist der Beschützer meiner Seele.
  5: O wende das Böse auf meine Feinde ab und nach deiner Treue vertilge sie;
  6: so werde ich dir dann willig Opfer darbringen und deinen Namen preisen, o Herr!
    denn er ist gütig.
  7: Denn aus aller Drangsal rettest du mich und auf meine Feinde schaut mein Auge
    herab.
  8: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  9: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
