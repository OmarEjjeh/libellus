# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 54
verses:
  1: Erhöre mein Gebet, o Gott! und verschmähe mein Flehen nicht; merke auf mich und
    erhöre mich!
  2: Ich bin betrübt in meiner Kümmernis und verwirrt ob der Stimme des Feindes und
    ob der Bedrängnis durch den Sünder.
  3: Denn sie wälzen Unheil auf mich und fallen in ihrem Grimme über mich her.
  4: Mein Herz ist geängstet in mir und des Todes Furcht ist auf mich gefallen.
  5: Furcht und Zittern kommt mich an und Finsternis umhüllt mich.
  6: 'Da sprach ich: O dass ich Flügel hätte gleich einer Taube, ich flöge fort und
    fände Ruhe!'
  7: Siehe, ich fliehe fernhin und bleibe in der Wüste.
  8: Ich harre auf den, der mich errettet aus der Kleinmut des Geistes und dem Sturme.
  9: Stürze sie, Herr! mach ihre Zunge uneins, denn ich sehe Gewalttat und Hader in
    der Stadt.
  10: Tag und Nacht umkreist Bosheit ihre Mauern und in ihrer Mitte herrscht Mühsal
  11: und Unrecht und von ihren Plätzen weicht nicht Wucher und Betrug.
  12: Denn wenn mein Feind mich gelästert hätte, so wollte ich es wohl ertragen.
  13: Und wenn der, welcher mich hasst, stolze Reden wider mich geführt hätte, so
    wollte ich mich wohl vor ihm verbergen.
  14: Aber du, sonst ein Herz mit mir, mein Führer und mein Vertrauter,
  15: der du zugleich mit mir süße Speisen genossest, die wir einträchtig in das Haus
    Gottes wandelten!
  16: Der Tod komme über sie und sie mögen lebendig in die Unterwelt hinabfahren!
  17: Denn Bosheit ist in ihrer Wohnung, unter ihnen.
  18: Ich aber rufe zu Gott und der Herr wird mich erretten.
  19: Abends und morgens und mittags will ich reden und kundtun, so wird er meine
    Stimme erhören.
  20: Er wird meine Seele erlösen und in Frieden versetzen vor denen, die mir nahetreten,
    denn gar viele sind gegen mich.
  21: Gott wird mich erhören und der da vor aller Zeit ist, sie demütigen.
  22: Denn sie ändern sich nicht und fürchten Gott nicht. Er streckt seine Hand aus
    zur Vergeltung.
  23: Sie haben seinen Bund entweiht, aber durch seinen Zornesblick werden sie zerstreut
    und sein Grimm verfolgt sie.
  24: Seine Worte sind gelinder denn Öl und gleichwohl sind sie Pfeile.
  25: Wirf deine Sorge auf den Herrn, und er wird dich erhalten; nicht auf immer wird
    er den Gerechten wanken lassen.
  26: Ja, du, o Gott! wirst sie hinabstürzen lassen in die Grube des Verderbens.
  27: Die Männer der Blutschuld und des Truges werden die Hälfte ihrer Lebenstage
    nicht erreichen, ich aber vertraue auf dich, o Herr!
  28: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  29: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
