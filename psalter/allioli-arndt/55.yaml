# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 55
verses:
  1: Erbarme dich meiner, o Gott! denn es treten mich die Menschen nieder, immerfort
    bedrängen sie mich und ängstigen mich.
  2: Meine Feinde bedrücken mich immerfort, denn viele sind der Streiter wider mich.
  3: Ich fürchte mich vor des Tages Höhe, doch ich vertraue auf dich.
  4: In Gott preise ich die mir gewordene Verheißung, auf Gott setze ich meine Hoffnung;
    ich bin ohne Furcht, was könnte Fleisch mir anhaben?
  5: Immerfort verfluchen sie meine Worte; alle ihre Gedanken sind wider mich zum
    Bösen.
  6: Sie kommen insgeheim zusammen, sie lauern meiner Ferse auf.
  7: Aber wie sie nach meinem Leben trachten, so wirst du sie mitnichten entrinnen
    lassen, im Zorne wirst du die Völker zermalmen. O Gott!
  8: Mein Leben mache ich dir kund; du brachtest meine Tränen vor dein Angesicht.
  9: Sowie du auch verheißen hast. Dann werden meine Feinde zurückweichen
  10: am Tage, da ich zu dir rufe; siehe, ich weiß, dass du mein Gott bist.
  11: In Gott preise ich sein Wort, in Gott preise ich seine Verheißung; auf Gott
    setze ich meine Hoffnung, ich hege keine Furcht, was könnte Fleisch mir anhaben?
  12: Mir liegen ob, Gott! Gelübde gegen dich, Dankopfer, die ich dir darbringen will;
  13: denn du hast meine Seele dem Tode entrissen und meine Füße dem Falle, dass ich
    vor Gott im Lichte der Lebendigen Wohlgefallen finde.
  14: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  15: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
