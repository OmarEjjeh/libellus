# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 56
verses:
  1: Erbarme dich meiner, o Gott! erbarme dich meiner; denn auf dich vertraut meine
    Seele.
  2: Und unter dem Schatten deiner Flügel suche ich Zuflucht, bis das Verderben vorübergeht.
  3: Zu Gott, dem Allerhöchsten, rufe ich, zu Gott, der mir Gutes erweist.
  4: Er sendet Hilfe vom Himmel und befreit mich, gibt meine Unterdrücker der Schmach
    hin;
  5: Gott sendet sein Erbarmen und seine Treue; er reißt mich aus der jungen Löwen
    Mitte, in Ängsten lege ich mich nieder.
  6: Der Menschenkinder Zähne sind Waffen und Pfeile und ihre Zunge ein scharfes Schwert.
  7: Erhebe dich hoch über die Himmel, o Gott! und deine Herrlichkeit zeige sich über
    die ganze Erde.
  8: Sie legten meinen Füßen Fallstricke und beugten meine Seele nieder.
  9: Sie gruben vor mir eine Grube und stürzten selbst in dieselbe.
  10: Bereit ist mein Herz, o Gott! bereit ist mein Herz, ich will singen und Psalmen
    spielen.
  11: Auf, mein Ruhm, auf, Saitenspiel und Harfe! am frühesten Morgen will ich mich
    erheben.
  12: Ich will dich preisen unter den Völkern, o Herr! und dir lobsingen unter den
    Nationen,
  13: denn groß bis zum Himmel ist dein Erbarmen und bis zu den Wolken deine Treue.
  14: Erhebe dich über die Himmel, o Gott! und deine Herrlichkeit breite sich über
    die ganze Erde hin aus.
  15: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  16: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
