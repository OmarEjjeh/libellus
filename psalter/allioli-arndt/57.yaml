# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen und auf
# die Versgrenzen des gesungenen Psalters ausgerichtet (Issue #1). Diese
# Ausrichtung ist direkt (Wortfolge identisch, Verszahl stimmt ueberein).
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 57
verses:
  1: Wenn ihr ja in Wahrheit gerechten Spruch fällt, so richtet, was recht ist, ihr
    Menschenkinder!
  2: Denn ihr verübt Bosheit im Herzen, eure Hände üben Gewalttat auf Erden.
  3: Entfremdet sind sie als Sünder von Mutterleibe an, sie gehen irre von der Geburt
    an, sie reden Lügen.
  4: Sie wüten gleich einer Schlange, gleich einer tauben Natter, die ihr Ohr verstopft,
  5: die nicht auf die Stimme der Beschwörer hört und des wohlerfahrenen Zauberers.
  6: Gott wird ihre Zähne in ihrem Munde zerschmettern, das Gebiss der Löwen wird
    der Herr zerbrechen.
  7: Sie werden zu nichts werden wie Wasser, das verrinnt, er spannt seinen Bogen,
    bis sie kraftlos hinsinken.
  8: Wie Wachs, das zerfließt, werden sie vergehen; Feuer fällt auf sie hernieder,
    dass sie die Sonne nicht mehr sehen.
  9: Bevor eure Dornen zum Strauche heranwachsen, rafft er sie, noch in der Fülle
    des Lebens, im Zorne hinweg.
  10: Der Gerechte wird sich freuen, wenn er die Rache sieht; er wird seine Hände
    waschen im Blute des Sünders.
  11: 'Und man wird sprechen: Ja, wahrlich, es gibt einen Lohn für den Gerechten;
    wahrlich, es ist ein Gott, der sie auf Erden richtet!'
  12: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  13: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
