# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 58
verses:
  1: Errette mich vor meinen Feinden, o mein Gott! und von meinen Widersachern befreie
    mich.
  2: Errette mich vor den Übeltätern und gegen die Blutgierigen sei meine Hilfe.
  3: Denn siehe, sie lauern meinem Leben auf, die Starken überfallen mich.
  4: Und doch habe ich mich nicht vergangen noch versündigt, o Herr! ohne Verschuldung
    und gerade war mein Wandel.
  5: Auf, komme mir entgegen und siehe darauf, und du Herr, Gott der Heerscharen,
    Gott Israels!
  6: Suche alle Völker heim, habe kein Erbarmen mit allen, die Böses tun.
  7: Am Abende kehren sie zurück und leiden Hunger wie Hunde und umkreisen die Stadt.
  8: Siehe, sie geifern mit ihrem Munde und ein Schwert ist auf ihren Lippen, denn
    wer hört es?
  9: Aber du, Herr! lachst ihrer, du machst alle Völker zuschanden.
  10: Meine Stärke will ich bei dir bewahren, denn du, o Gott! bist mein Schirm. Meines
    Gottes Barmherzigkeit wird mir zuvorkommen,
  11: Gott wird mich mein Auge weiden lassen an meinen Feinden. Töte sie nicht, dass
    meine Volksgenossen es nicht vergessen!
  12: Zerstreue sie durch deine Macht und bringe sie zu Falle, Herr! mein Beschützer,
  13: ob der Sünde ihres Mundes und der Rede ihrer Lippen. Mögen sie gefangen werden
    in ihrem Hochmut.
  14: Um der Verfluchungen und der Lüge willen werden sie der Vernichtung geweiht
    werden, der Vernichtung im Zorne, dass sie nicht mehr seien.
  15: Sie sollen wissen, dass Gott über Jakob herrscht und bis an die Enden der Erde!
  16: Am Abende kehren sie zurück und leiden Hunger wie Hunde und umkreisen die Stadt.
  17: Sie zerstreuen sich, um Nahrung zu suchen, und murren, wenn sie nicht satt werden.
  18: Ich aber will deine Stärke besingen und am frühen Morgen ob deines Erbarmens
    frohlocken,
  19: denn du bist mein Schirm und meine Zuflucht geworden am Tage meiner Not.
  20: O mein Helfer! dir will ich lobsingen, denn du, Gott, bist mein Beschützer,
    mein Gott, mein Erbarmen!
  21: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  22: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
