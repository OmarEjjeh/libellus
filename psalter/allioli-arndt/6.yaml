# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen und auf
# die Versgrenzen des gesungenen Psalters ausgerichtet (Issue #1). Diese
# Ausrichtung ist direkt (Wortfolge identisch, Verszahl stimmt ueberein).
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 6
verses:
  1: Herr! straf mich nicht in deinem Grimme und züchtige mich nicht in deinem Zorne.
  2: Erbarme dich meiner, o Herr! denn ich bin schwach; heile mich, o Herr! denn meine
    Gebeine beben
  3: und meine Seele ist sehr bestürzt; du aber, o Herr! wie lange noch?
  4: Wende dich, Herr! und rette meine Seele, hilf mir um deiner Barmherzigkeit willen.
  5: Denn niemand ist, der im Tode deiner gedenkt, im Totenreiche aber, wer wird da
    dich preisen?
  6: Ich mühe mich ab in meinem Seufzen, benetze jede Nacht mein Bett und bade mein
    Lager mit meinen Tränen.
  7: Vor Gram ist mein Auge dunkel geworden, ich bin gealtert, umringt von meinen
    Feinden allen.
  8: Weichet von mir alle, die ihr Frevel übt, denn der Herr hat das Rufen meines
    Weinens erhört!
  9: Der Herr hat mein Flehen erhört, der Herr hat mein Gebet angenommen.
  10: Es sollen beschämt werden und heftig erschrecken alle meine Feinde, sie sollen
    zurückweichen und plötzlich beschämt werden.
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
