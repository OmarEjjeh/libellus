psalmus: 60
verses:
  1: Erhöre, o Gott! mein Flehen, hab acht auf mein Gebet!
  2: Vom Ende der Erde rufe ich zu dir, da mein Herz in Ängsten ist. Du erhobst mich
    auf einen Felsen, leitetest mich;
  3: denn du warst meine Hoffnung, ein fester Turm gegen den Feind.
  4: Ich werde immerdar in deinem Zelte weilen, beschirmt sein unter dem Schatten
    deiner Flügel.
  5: Denn du, mein Gott! hast mein Gebet erhört, hast denen das Erbteil gegeben, die
    deinen Namen fürchten.
  6: Du wirst zu den Lebenstagen des Königs Tage hinzufügen, seine Jahre von Geschlecht
    zu Geschlecht währen lassen.
  7: Immerdar bleibt er vor dem Angesichte Gottes. Wer wird seine Barmherzigkeit und
    Treue erforschen?
  8: So will ich deinem Namen ewig lobsingen, auf dass ich meine Gelübde erfülle Tag
    um Tag.
  9: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  10: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
