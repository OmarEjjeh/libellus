psalmus: 61
verses:
  1: Soll wohl meine Seele Gott nicht unterworfen sein, von ihm kommt mir ja Hilfe?
  2: Ja, er nur ist mein Gott und mein Retter, mein Schirmer, ich werde nicht mehr
    wanken.
  3: Wie lange stürmt ihr ein auf einen Mann und geht mit Mordgedanken um, ihr alle,
    wie auf eine sinkende Wand und eine einstürzende Mauer?
  4: Nur darauf sinnen sie, mir meine Ehre zu rauben, dürstend irre ich umher; mit
    ihrem Munde segnen sie, in ihrem Herzen fluchen sie.
  5: Doch du, meine Seele, sei Gott unterworfen, denn von ihm kommt mir Zuversicht.
  6: Denn er ist mein Gott und mein Retter, mein Helfer, ich werde nicht in die Fremde
    fliehen.
  7: Auf Gott beruht mein Heil und mein Ruhm, er ist der Gott, der mir hilft, und
    meine Hoffnung beruht auf Gott!
  8: Vertraue auf ihn, du ganze Gemeinde des Volkes, schüttet euer Herz vor ihm aus!
    Gott ist unser Helfer in Ewigkeit.
  9: Fürwahr! nichtig sind die Menschenkinder, trügerisch die Menschenkinder, werden
    sie auf der Waage gewogen, sie täuschen allesamt wegen ihrer Nichtigkeit.
  10: Verlasset euch nicht auf Unrecht und verlanget nicht nach Raub, und wenn euch
    Reichtum zuströmt, so hänget das Herz nicht an denselben!
  11: 'Einmal hat Gott gesprochen. Diese zwei Dinge vernahm ich: Gott gehört die Macht
    zu, und bei dir, o Herr! ist Erbarmen; denn du vergiltst einem jeden nach seinen
    Taten.'
  12: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  13: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
