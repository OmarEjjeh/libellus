# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 62
verses:
  1: O Gott, mein Gott! zu dir erwache ich früh,
  2: es dürstet nach dir meine Seele, wie sehr schmachtet nach dir mein Fleisch.
  3: Im wüsten, unzugänglichen und wasserlosen Lande, so erscheine ich vor dir im
    Heiligtume, um deine Macht und deine Herrlichkeit zu schauen.
  4: Denn deine Barmherzigkeit ist besser als das Leben. Meine Lippen sollen dich
    loben.
  5: Also will ich dich preisen mein Leben lang und in deinem Namen meine Hände erheben.
  6: Wie an Mark und Fett ersättige sich meine Seele, mein Mund soll mit jubelnden
    Lippen dich preisen.
  7: Gedenke ich deiner auf meinem Lager, so sinne ich noch am Morgen über dich, denn
    du bist mein Helfer.
  8: Und im Schatten deiner Flügel will ich jubeln, dir hängt meine Seele an, deine
    Rechte hält mich aufrecht.
  9: Sie aber trachten mir vergebens nach dem Leben, sie werden hinabfahren in die
    Tiefen der Erde, werden der Gewalt des Schwertes preisgegeben, eine Beute der
    Füchse werden.
  10: Der König aber wird sich Gottes freuen, es rühmen sich alle, die bei ihm schwören,
    denn der Mund derer, die Gottloses reden, ist verstopft.
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
