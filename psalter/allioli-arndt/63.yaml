# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 63
verses:
  1: Erhöre, o Gott! mein Gebet, da ich flehe, von dem Schrecken des Feindes rette
    meine Seele.
  2: Du wirst mich beschirmen vor der Gemeinschaft der Bösewichter, vor der Rotte
    der Übeltäter.
  3: Denn sie schärfen wie ein Schwert ihre Zungen, spannen den Bogen, eine bittere
    Waffe, um im Verborgenen auf den Unbefleckten zu schießen.
  4: Jählings schießen sie auf ihn ohne Scheu; sie halten fest an bösem Anschlag,
  5: 'verabreden sich, Fallstricke zu verbergen, und sagen: Wer wird sie sehen?'
  6: Sie ersinnen Freveltat, haben ersonnen, was sie gedachten,
  7: und der Mensch erhebt sein Herz zu hohen Dingen, aber Gott zeigt sich erhaben!
  8: Die Wunden von ihnen sind wie durch Pfeile von Kinderhand und ihre Zungen werden
    schwach wider sie.
  9: Es entsetzen sich alle, die sie sehen, und alle Menschen erfasst Furcht;
  10: sie verkünden Gottes Tun und erkennen seine Werke.
  11: Der Gerechte erfreut sich in dem Herrn und vertraut auf ihn, und frohlocken
    werden alle, die aufrichtigen Herzens sind.
  12: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  13: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
