# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 64
verses:
  1: Dir ziemt Lobpreis, o Gott! auf Sion und dir sollen Gelübde entrichtet werden
    in Jerusalem.
  2: Erhöre mein Gebet, zu dir kommt alles Fleisch.
  3: Gottlose Taten haben uns überwältigt, doch du vergabst uns unsere Missetaten.
  4: Glückselig, wen du erwählst und annimmst, dass er in deinen Vorhöfen wohne;
  5: wir werden gesättigt werden von deines Hauses Gütern; dein Tempel ist heilig,
    wunderherrlich in Gerechtigkeit.
  6: Erhöre uns, Gott, du unser Retter, du Hoffnung aller Enden der Erde und des fernen
    Meeres!
  7: Der du durch deine Kraft die Berge feststellst, mit Stärke umgürtet bist; der
    du das Meer bis auf den Grund aufwühlst, das Brausen seiner Wogen. Es erschrecken
    die Völker
  8: und die Bewohner der äußersten Enden fürchten sich vor deinen Zeichen; da, wo
    der Morgen und Abend beginnt, spendest du Jubel.
  9: Du suchst das Land heim und tränkst es reichlich, du bereicherst es in Fülle.
  10: Der Strom Gottes ist angefüllt vom Wasser, du bereitest ihnen Speise; denn solcherweise
    ist das Land bereitet.
  11: Tränkst du seine Furchen, so mehrst du sein Wachstum; wenn du demselben Regen
    sendest, sprosst es freudig.
  12: Du segnest den Kranz des Jahres mit deiner Güte und deine Felder füllen sich
    mit Überfluss.
  13: Es prangen die Triften der Wüste und mit Jubel umgürten sich die Hügel.
  14: Es werden die Widder der Herden bekleidet und die Täler haben Überfluss an Korn;
    alles jauchzt, ja, singt Lob.
  15: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  16: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
