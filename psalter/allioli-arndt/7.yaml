# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 7
verses:
  1: O Herr, mein Gott! auf dich vertraue ich, errette mich von allen meinen Verfolgern
    und befreie mich,
  2: auf dass nicht etwa einer wie ein Löwe mein Leben dahinraffe, während keiner
    da ist, der mich erlöse und errette.
  3: Mein Herr und Gott! wenn ich solches getan, wenn Unrecht an meinen Händen ist,
  4: wenn ich denen, die mir Böses taten, vergolten habe, so möge ich nach Verdienst
    schutzlos dahinsinken vor meinen Feinden.
  5: Dann möge der Feind meine Seele verfolgen und ergreifen und möge mein Leben zu
    Boden treten und meine Ehre in den Staub niederziehen.
  6: Erhebe dich, o Herr! in deinem Zorne und zeige dich erhaben wider meiner Feinde
    Wüten!
  7: Ja, erhebe dich, o Herr, mein Gott! nach dem Gebote, das du gegeben, und es umgebe
    dich der Völker Schar,
  8: und ihretwegen kehre zurück zur Höhe. Der Herr ist Richter über die Völker.
  9: Schaffe mir Recht, o Herr! nach meiner Gerechtigkeit und nach meiner Unschuld,
    die mir innewohnt.
  10: Die Bosheit der Sünder werde vernichtet und den Gerechten richte auf, o Gott!
    du Prüfer der Herzen und Nieren,
  11: Rechte Hilfe kommt mir von dem Herrn, der die, welche aufrichtigen Herzens sind,
    rettet.
  12: Gott ist ein gerechter Richter, stark und langmütig, wird er wohl für und für
    zürnen?
  13: Wenn ihr euch nicht bekehrt, wird er sein Schwert zücken. Schon hat er seinen
    Bogen gespannt und hält ihn bereit.
  14: Er hat tödliche Geschosse darauf gelegt, seine Pfeile hat er zu Brandpfeilen
    gemacht.
  15: Siehe, jener geht schwanger mit Ungerechtigkeit, er empfängt Groll und gebiert
    Unrecht.
  16: Eine Grube macht er und gräbt sie aus, doch er stürzt in die Vertiefung, die
    er gemacht.
  17: Auf sein Haupt kehrt sein Unheil zurück und sein Frevel stürzt auf seinen Scheitel
    herab.
  18: Ich aber will den Herrn preisen nach seiner Gerechtigkeit und dem Namen des
    Herrn, des Allerhöchsten, lobsingen.
  19: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  20: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
