# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 70
verses:
  1: Auf dich, Herr! hoffe ich, lass mich nimmermehr zuschanden werden, um deiner
    Gerechtigkeit willen befreie mich und rette mich.
  2: O, neige mir dein Ohr zu und hilf mir!
  3: Sei mir ein schirmender Gott, eine feste Stätte, dass du mir helfest.
  4: Denn meine Feste und meine Zuflucht bist du.
  5: Mein Gott! befreie mich aus der Gewalt des Sünders und aus der Gewalt dessen,
    der wider das Gesetz handelt, und des Gottlosen.
  6: Denn du bist meine Zuversicht, o Herr! meine Hoffnung, o Herr, von meiner Jugend
    an!
  7: Auf dich bin ich gestützt vom Mutterschoße an, vom Mutterleibe an bist du mein
    Beschirmer.
  8: Dir gilt mein Lobgesang immerdar. Wie ein Wunder bin ich vielen geworden, denn
    du bist ein starker Helfer.
  9: Mein Mund sei voll deines Lobes, dass ich deine Herrlichkeit besinge, deine Größe
    immerdar.
  10: Verwirf mich nicht zur Zeit des Alters; wenn meine Kraft hingeschwunden, verlass
    mich nicht!
  11: Denn meine Feinde sprechen über mich, und die auf mein Leben lauern, halten
    Rat miteinander,
  12: 'sprechend: Gott hat ihn verlassen! Verfolgt und ergreifet ihn, denn niemand
    ist, der ihn rette!'
  13: Gott, sei nicht fern von mir, mein Gott, habe acht auf meine Hilfe!
  14: Es mögen beschämt werden und umkommen, die mir übel nachreden, mit Schmach und
    Schande bedeckt werden, die mein Unglück suchen.
  15: Ich aber will allezeit vertrauen und all dein Lob immerdar noch mehr singen.
  16: Mein Mund soll deine Gerechtigkeit verkünden, immerfort dein Heil,
  17: denn ich vermag nicht sie zu beschreiben. So will ich betrachtend eingehen auf
    die Machterweise des Herrn, deiner Gerechtigkeit, o Herr! allein gedenken.
  18: O Gott! du hast mich unterwiesen von meiner Jugend an und bis hierher verkünde
    ich deine Wunder.
  19: So verlass mich auch bis ins Alter und bis zum Greisentum nicht, o Gott!
  20: bis ich allen kommenden Geschlechtern deine Stärke verkünde, deine Macht
  21: und deine Gerechtigkeit, o Gott! bis zum Himmel, was du Großes getan. Gott!
    wer ist dir gleich?
  22: Wie viel schlimme Drangsal hast du mich schauen lassen! Doch du belebst mich
    wieder neu und ziehst mich wieder aus den Tiefen der Erde empor.
  23: Du mehrst noch reicher deine Herrlichkeit und wirst wiederum mein Trost.
  24: So will ich denn dir zu Ehren im Psalterspiel deine Treue preisen, o Gott! dir
    lobsingen auf der Harfe, o Heiliger Israels!
  25: Meine Lippen sollen frohlocken, wenn ich dir singe, und meine Seele, die du
    erlöst hast.
  26: Auch meine Zunge soll immerfort deine Gerechtigkeit verkünden, wenn beschämt
    und zuschanden werden, die mein Unglück suchen.
  27: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  28: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
