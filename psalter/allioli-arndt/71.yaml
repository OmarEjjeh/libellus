# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 71
verses:
  1: O Gott! gib dem Könige dein Gericht und deine Gerechtigkeit dem Königssohne,
  2: dass er dein Volk in Gerechtigkeit richte und deine Armen nach dem Rechte.
  3: Es mögen die Berge dem Volke Frieden tragen und die Hügel Gerechtigkeit.
  4: Er wird den Armen im Volke Recht schaffen, den Söhnen der Armen helfen und den
    Gewalttätigen niederbeugen.
  5: Und er wird bleiben, solange Sonne und Mond währt, von Geschlecht zu Geschlecht.
  6: Er wird niedersteigen wie der Regen auf das Vließ und wie Regen, der auf die
    Erde herniederrieselt.
  7: In seinen Tagen wird die Gerechtigkeit aufsprossen und Fülle des Friedens, bis
    der Mond nicht mehr ist.
  8: Und er wird von einem Meere zum andern herrschen und vom Strome bis an die Grenzen
    des Erdkreises.
  9: Vor ihm werden die Äthiopier niederfallen und seine Feinde den Staub lecken.
  10: Die Könige von Tharsis und die Inseln werden Geschenke opfern, die Könige von
    Arabien und Saba werden Gaben darbringen.
  11: Es sollen ihn alle Könige der Erde anbeten, alle Völker ihm dienen.
  12: Denn er wird den Gedrückten von dem Mächtigen befreien, den Armen, der keinen
    Helfer hat;
  13: er wird des Armen und Geringen schonen und den Seelen des Notleidenden helfen.
  14: Aus Wucher und Gewalttat erlöst er ihre Seele, denn Ehre würdig ist ihr Name
    vor ihm.
  15: Er wird leben und man wird ihm vom Golde Arabiens geben und seinetwegen immerdar
    anbeten, allezeit ihn preisen.
  16: Und Getreide wird im Lande auf den Gipfeln der Berge sein, seine Frucht überragt
    den Libanon und es blühen aus der Stadt die Bewohner hervor, wie das Gras aus
    der Erde.
  17: Gepriesen sei sein Name in Ewigkeit, im Angesichte der Sonne dauert sein Name
    fort!
  18: Und gesegnet werden in ihm alle Geschlechter der Erde, alle Völker werden ihn
    preisen.
  19: Gepriesen sei der Herr, der Gott Israels, der allein Wunder tut.
  20: und gepriesen sei der Name seiner Herrlichkeit auf ewig; und von seiner Herrlichkeit
    werde die ganze Erde erfüllt! Amen, Amen!
  21: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  22: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
