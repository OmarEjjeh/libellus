# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 72
verses:
  1: Wie gütig ist Gott gegen Israel, gegen die, welche lauteren Herzens sind!
  2: Meine Füße aber wären bald gestrauchelt, meine Schritte wären fast ausgeglitten.
  3: Denn ich ereiferte mich über die Frevler, da ich den Frieden der Sünder sah.
  4: Denn kein Absehen ist auf ihren Tod und nicht hat das Leid Dauer, das sie trifft.
  5: Sie teilen nicht die Mühsal der Menschen und werden nicht wie andere Menschen
    geschlagen.
  6: Darum hält Hochmut sie gefangen, sind sie mit ihrer Sünde und ihrer Gottlosigkeit
    umhüllt.
  7: Es tritt wie aus fettem Grunde ihre Bosheit hervor, sie gehen den Lüsten ihres
    Herzens nach.
  8: Sie ersinnen und reden Bosheit, reden Frevel aus ihrer Höhe herab.
  9: Sie erheben ihren Mund in den Himmel und ihre Zunge wandelt auf der Erde.
  10: Darum wendet sich mein Volk dorthin, denn gute Tage finden sich bei ihnen.
  11: 'Sie sprechen: Wie sollte Gott es wissen und gäbe es Wissen bei dem Höchsten?'
  12: Siehe, sie sind Sünder und haben doch Überfluss in der Welt, haben Reichtümer
    erlangt.
  13: 'Und ich sprach: So habe ich denn umsonst mein Herz gerecht erhalten und unter
    den Unschuldigen meine Hände gewaschen?'
  14: Und ward doch immerfort geschlagen und gezüchtigt schon am frühen Morgen?
  15: 'Aber wenn ich sagte: Solches will ich reden, siehe, so hätte ich das Geschlecht
    deiner Kinder verleugnet!'
  16: Ich sann nach, um dies zu verstehen, aber es blieb mir zu mühsam,
  17: bis ich in das Heiligtum Gottes einging und acht hatte, welches ihr Ende sei.
  18: Ja, auf betrügerischen Boden stellst du sie, du stürzest sie, indes sie sich
    erheben.
  19: Wie sind sie zur Öde geworden, plötzlich dahingeschwunden, untergegangen um
    ihrer Sünde willen!
  20: Wie einen Traum der Erwachenden, so lässest du, Herr! in deiner Stadt ihr Bild
    zu nichts werden.
  21: Weil mein Herz entbrannt und meine Nieren bewegt waren, ward auch ich zu nichts
    gemacht und hatte keine Einsicht mehr.
  22: Wie ein Lasttier ward ich vor dir, dennoch war ich immer bei dir.
  23: Du hältst mich bei meiner Rechten und leitest mich nach deinem Willen und nimmst
    mich zu Ehren an.
  24: Denn was habe ich im Himmel und was begehre ich auf Erden außer dir?
  25: Schwindet auch mein Fleisch und mein Herz dahin, meines Herzens Gott und mein
    Anteil ist Gott in Ewigkeit.
  26: Denn siehe, die sich von dir entfernen, kommen um; du vertilgst alle, die von
    dir abfallen.
  27: Mir aber ist es gut Gott anzuhängen, auf Gott, den Herrn, meine Hoffnung zu
    setzen;
  28: auf dass ich all dein Lob in den Toren der Tochter Sion verkünde.
  29: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  30: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
