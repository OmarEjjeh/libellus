# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 73
verses:
  1: Warum, o Gott! hast du uns auf immer verworfen und ist dein Zorn wider die Schafe
    deiner Weide entbrannt?
  2: Gedenke deiner Gemeinde, welche dein Eigentum ist von Anfang her.
  3: Du hast sie als den Anteil deines Erbes erlöst; es ist der Berg Sion, auf dem
    du wohnst.
  4: Erhebe beständig deine Hände gegen ihre maßlos stolzen Taten. Wieviel Böses hat
    der Feind im Heiligtume verübt!
  5: Es prahlten, die dich hassen, in der Mitte deiner Feste.
  6: Sie stellten ihre Zeichen auf als Siegeszeichen und handelten vernunftlos wie
    in den Toren, so auf den Zinnen des Tempels.
  7: Wie im Walde hieben sie mit Äxten seine Tore insgesamt aus, mit Beil und Axt
    stürzten sie die heilige Wohnung nieder.
  8: Sie steckten dein Heiligtum in Brand, entweihten die Wohnung deines Namens, sie
    dem Boden gleichmachend.
  9: 'Sie dachten in ihrem Sinne, ihr ganzes Geschlecht allzumal: Lasset uns alle
    Festtage Gottes im Lande abschaffen!'
  10: Unsere Zeichen sehen wir nicht, kein Prophet ist mehr da, und Er kennt uns nicht
    mehr!
  11: Wie lange, o Gott! soll der Feind lästern, soll der Widersacher deinen Namen
    beständig erbittern?
  12: Warum ziehst du deine Hand und deine Rechte zurück von deines Busens Mitte ganz
    und gar?
  13: Gott ist ja unser König von jeher, hat Heil gewirkt inmitten der Erde.
  14: Du hast in deiner Kraft das Meer festgestellt, hast der Drachen Köpfe in den
    Wassern zerschmettert.
  15: Du hast der Drachen Köpfe zerschmettert, sie den Völkern Äthiopiens zum Fraß
    gegeben.
  16: Du ließest Quellen und Ströme hervorbrechen, du ließest die Flüsse Ethans versiegen.
  17: Dein ist der Tag und dein ist die Nacht, du hast das Morgenrot und die Sonne
    geschaffen.
  18: Du stelltest alle Grenzen der Erde fest, Sommer und Frühling hast du geschaffen.
  19: 'Sei dessen eingedenk: der Feind schmäht den Herrn und ein törichtes Volk reizt
    deinen Namen.'
  20: Gib nicht den Raubtieren die Seelen derer, die dich bekennen, preis und die
    Seelen deiner Armen vergiss nicht auf immer.
  21: Schaue hin auf deinen Bund, denn die in Finsternis dahinlebenden Bewohner des
    Landes haben Überfluss an Wohnungen der Ungerechtigkeit.
  22: Lass den Unterdrückten nicht mit Schanden abgewiesen werden, der Arme und Hilflose
    werden deinen Namen preisen.
  23: Erhebe dich, o Gott! entscheide deine Sache, gedenke der Schmach, die dir die
    Toren unaufhörlich zufügen.
  24: Vergiss nicht das Geschrei deiner Feinde, der Hochmut derer, die dich hassen,
    steigt fort und fort.
  25: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  26: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
