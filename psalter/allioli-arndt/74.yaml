# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 74
verses:
  1: Wir preisen dich, o Gott! wir preisen und rufen deinen Namen an,
  2: wir verkünden deine Wunder. Wenn ich die geeignete Zeit gekommen sehe, werde
    ich gerechtes Gericht halten.
  3: Wenn die Erde vor Furcht vergeht und alle ihre Bewohner, ich festige ihre Säulen.
  4: 'Darum spreche ich zu den Gottlosen: Handelt nicht gottlos, und zu den Sündern:
    Hebet das Horn nicht in die Höhe!'
  5: Traget nicht euer Horn hoch, redet nicht Böses wider Gott!
  6: Denn weder vom Aufgang noch vom Untergang noch von den Bergen der Wüste her,
    sondern Gott ist Richter.
  7: Diesen erniedrigt und jenen erhöht er, denn ein Becher reinen Weines, voll von
    Gemischtem, ist in des Herrn Hand;
  8: Er neigt ihn von dieser Seite zu jener, aber noch ist er nicht geleert, seine
    Hefe ist noch darin und fortwährend sollen davon alle Sünder der Erde trinken.
  9: Doch ich will es ewiglich verkünden, will dem Gotte Jakobs lobsingen
  10: und alle Hörner der Sünder will ich zerbrechen, aber das Horn der Gerechten
    soll erhöht werden.
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
