# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 76
verses:
  1: Ich rufe mit meiner Stimme zu dem Herrn, mit meiner Stimme zu Gott, dass er auf
    mich merke.
  2: Am Tage meiner Drangsal suche ich Gott, strecke meine Hände des Nachts nach ihm
    aus und täusche mich nicht;
  3: Meine Seele will sich nicht trösten lassen! Ich gedenke an Gott und freue mich;
    mühe ich mich sorgend, so verzagt mein Geist.
  4: Meine Augen blicken die ganze Nacht hindurch nach Hilfe aus, ich bin voller Unruhe
    und kann nicht reden.
  5: Ich überdenke die Tage der Vorzeit und die längst entschwundenen Jahre erwäge
    ich
  6: und sinne des Nachts in meinem Herzen und sinne beständig nach und härme meinen
    Geist ab.
  7: Wird denn Gott auf ewig verwerfen oder nicht ferner mehr gnädig sein?
  8: Oder wird er auf immer sein Erbarmen entziehen von Geschlecht zu Geschlecht?
  9: Oder wird Gott vergessen, gnädig zu sein, und in seinem Zorn seine Erbarmungen
    zurückhalten?
  10: 'Da sprach ich: Nun beginne ich! Diese Änderung kommt von der Rechten des Allerhöchsten!'
  11: Ich will der Taten des Herrn gedenken, denn ich habe deine Wundertaten im Gedächtnis
    vom Anfang her,
  12: und nachsinnen will ich über all dein Tun und mich vertiefen in deine Taten.
  13: O Gott! in Heiligkeit ist dein Weg. Wo ist ein Gott so groß wie unser Gott?
    Du bist Gott allein, der du Wunder tust;
  14: Du hast unter allen Völkern deine Macht kund werden lassen. Du hast durch deinen
    Arm dein Volk erlöst, die Söhne Jakobs und Josephs.
  15: Es sahen dich die Wasser, o Gott es sahen dich die Wasser und gerieten in Furcht,
    erschüttert wurden die Tiefen.
  16: Gewaltig war das Rauschen der Wasser. Die Wolken donnerten.
  17: Und deine Pfeile fuhren hernieder. Der Schall deines Donners rollte daher,
  18: Deine Blitze leuchteten über den Erdkreis, es bebte und erzitterte die Erde.
  19: Durch das Meer ging dein Weg und dein Pfad durch große Wasser und deine Spuren
    erkannte man nicht.
  20: Du führtest dein Volk wie Schafe durch Moses und Aaron.
  21: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  22: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
