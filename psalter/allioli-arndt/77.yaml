# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 77
verses:
  1: Habe acht, mein Volk! auf meine Lehre, neiget euer Ohr den Worten meines Mundes!
  2: Ich will meinen Mund zur Spruchrede auftun, Rätsel aussprechen von uralter Zeit.
  3: Was wir gehört und erfahren und unsere Väter uns erzählt haben,
  4: soll nicht verborgen sein vor ihren Kindern im kommenden Geschlechte.
  5: Wir erzählen das Lob des Herrn und seine Macht und seine Wundertaten, die er
    vollbracht.
  6: Denn er hat ein Zeugnis in Jakob aufgerichtet, ein Gesetz in Israel gegeben,
  7: Worin er unseren Vätern geboten, diese ihren Kindern kundzugeben, damit das spätere
    Geschlecht es erfahre,
  8: Die Kinder, welche geboren werden würden, damit sie auftreten und ihren Kindern
    davon Kunde geben,
  9: auf dass diese auf Gott ihr Vertrauen setzen und nicht der Werke Gottes vergessen
    und seine Gebote beobachten,
  10: und nicht werden wie ihre Väter, ein boshaftes und erbitterndes Geschlecht,
  11: Ein Geschlecht, das kein gerades Herz hatte und dessen Geist nicht treu hielt
    an Gott.
  12: Die Söhne Ephrems, Schützen, die den Bogen spannten, ergriffen am Tage des Kampfes
    die Flucht.
  13: Sie hielten den Bund Gottes nicht und wollten in seinem Gesetze nicht wandeln
  14: und sie vergaßen seiner Wohltaten und seiner Wunder, die er sie hatte schauen
    lassen.
  15: Vor ihren Vätern hatte er Wunder getan im Lande Ägypten, im Gefilde von Tanis.
  16: Er spaltete das Meer und führte sie hindurch und ließ die Wasser stehen wie
    in einem Schlauche.
  17: Und er führte sie mit der Wolke des Tags und die ganze Nacht mit leuchtendem
    Feuer.
  18: Er spaltete den Felsen in der Wüste und tränkte sie mit tiefen Fluten.
  19: Und er ließ Wasser aus dem Felsen hervorkommen und Wasser niederrinnen gleich
    Strömen.
  20: Doch sie fuhren fort wider ihn zu sündigen, reizten den Allerhöchsten zum Zorne
    in der wasserleeren Wüste.
  21: Und sie versuchten Gott in ihren Herzen, indem sie Speise verlangten nach ihren
    Gelüsten;
  22: 'und sie redeten Schlimmes wider Gott und sprachen: Sollte wohl Gott in der
    Wüste einen Tisch zurichten können?'
  23: Denn wohl schlug er den Felsen, dass Wasser floss und Bäche sich ergossen,
  24: Aber vermag er auch Brot zu geben oder seinem Volke einen Tisch zuzurichten?
  25: Darum, als der Herr dies hörte, zögerte er und es entbrannte ein Feuer wider
    Jakob und Zornesglut stieg auf gegen Israel,
  26: weil sie Gott nicht glaubten und auf seine Hilfe nicht hofften.
  27: Und er gebot den Wolken dort oben und öffnete die Pforten des Himmels
  28: und ließ für sie Manna zur Speise regnen und gab ihnen Brot vom Himmel.
  29: Brot der Engel aß der Mensch, Speise sandte er ihnen im Überflusse.
  30: Er ließ den Südwind vom Himmel aufbrechen und führte durch seine Stärke den
    Nordwind herbei.
  31: Und er ließ Fleisch auf sie herabregnen wie Staub und wie Meeressand gefiederte
    Vögel.
  32: Mitten in ihr Lager fielen sie, rings um ihre Zelte her.
  33: Da aßen sie und wurden übersatt und er erfüllte ihnen ihre Gelüste, nicht wurde
    ihr Wunsch ihnen vorenthalten.
  34: Aber noch war ihre Speise in ihrem Munde, da erhob sich der Zorn Gottes wider
    sie
  35: Und er tötete ihre Starken und lähmte die Auserwählten Israels.
  36: Trotz alledem sündigten sie fort und glaubten nicht an seine Wunder.
  37: Darum schwanden ihre Tage in Vergänglichkeit dahin und ihre Jahre in Hast.
  38: Wenn er den Tod unter sie schickte, so suchten sie ihn und kehrten um und kamen
    in der Frühe zu ihm
  39: und gedachten, dass Gott ihr Helfer und Gott, der Allerhöchste, ihr Erlöser
    sei.
  40: Aber sie liebten ihn nur mit ihrem Munde und logen ihm mit ihrer Zunge.
  41: Ihr Herz jedoch war nicht aufrichtig gegen ihn und sie wurden nicht treu erfunden
    in seinem Bunde.
  42: Doch er ist barmherzig und verzeiht ihre Sünden und vernichtet sie nicht.
  43: Und er wandte vielmals seinen Zorn ab und ließ seinen ganzen Grimm nicht entbrennen.
  44: Und er gedachte, dass sie Fleisch sind, ein Hauch, der dahingeht und nicht wiederkehrt.
  45: Wie oft erbitterten sie ihn in der Wüste, reizten ihn zum Zorne in der Einöde!
  46: Immer wieder versuchten sie Gott und erbitterten den Heiligen Israels.
  47: Sie gedachten nicht seiner Hand am Tage, da er sie aus der Hand des Drängers
    befreite,
  48: wie er seine Zeichen in Ägypten tat und seine Wunder im Gefilde von Tanis.
  49: Er wandelte ihre Flüsse in Blut und ihre Regenbäche, dass sie nicht daraus trinken
    mochten.
  50: Er sandte unter sie Hundsfliegen, die sie fraßen, und Frösche, die über sie
    Verderben brachten.
  51: Er gab ihre Frucht dem Brande preis und den Ertrag ihrer Arbeit den Heuschrecken.
  52: Er vernichtete ihre Weinberge durch Hagel und ihre Maulbeerbäume durch Schloßen.
  53: Er gab ihr Vieh dem Hagel preis und ihre Habe dem Feuer.
  54: Er entsandte über sie die Glut seines Zornes, Zorn und Grimm und Drangsal, Schickungen
    durch schlimme Engel.
  55: Er ließ seinem Zorne freien Lauf, entzog ihre Seelen nicht dem Tode und überantwortete
    ihr Vieh dem Tode.
  56: Er schlug alle Erstgeburt im Lande Ägypten, die Erstlinge all ihrer Arbeit in
    den Gezelten Chams.
  57: Er führte sein Volk wie Schafe hinweg und leitete sie wie eine Herde in der
    Wüste
  58: und führte sie in Zuversicht, dass sie sich nicht fürchten durften, während
    das Meer ihre Feinde bedeckte.
  59: Er brachte sie zu seinem heiligen Berg, dem Berge, den seine Rechte erworben.
  60: Er vertrieb vor ihrem Angesichte die Völker und verteilte ihnen das Land durch
    das Los mit der Messschnur
  61: und ließ in ihren Hütten die Stämme Israels wohnen.
  62: Aber sie versuchten und erzürnten Gott, den Allerhöchsten, und beobachteten
    seine Anordnungen nicht.
  63: Sie wandten sich ab und hielten den Bund nicht und wandten sich wie ihre Väter
    um wie ein schlechter Bogen.
  64: Sie reizten ihn zum Zorne durch ihre Höhen und erregten seine Eifersucht durch
    ihre geschnitzten Bilder.
  65: Da Gott dies hörte, verwarf er und vernichtete er Israel.
  66: Und er verwarf das Zelt zu Silo, sein Zelt, wo er unter den Menschen seine Wohnung
    aufgeschlagen,
  67: und gab ihre Macht in Gefangenschaft und ihre Zierde in die Gewalt der Feinde.
  68: Und er überantwortete sein Volk dem Schwerte und wandte sich von seinem Erbe.
  69: Ihre Jünglinge fraß das Feuer und ihre Jungfrauen werden nicht betrauert.
  70: Ihre Priester fielen durch das Schwert und ihre Witwen wurden nicht beweint.
  71: Da erwachte der Herr wie ein Schlafender, wie ein Held, der vom Weine reichlich
    genossen.
  72: Und er schlug seine Feinde auf den Rücken, ewige Schande brachte er über sie.
  73: Und er verwarf das Zelt Josephs und erwählte den Stamm Ephraim nicht,
  74: sondern erwählte den Stamm Juda, den Berg Sion, den er liebte.
  75: Und er baute in dem Lande, das er auf ewig gegründet, sein Heiligtum wie der
    Einhörner Horn,
  76: und erwählte David, seinen Diener, und nahm ihn von den Schafherden weg, von
    säugenden Schafen holte er ihn hinweg,
  77: dass er seinen Diener Jakob weide, Israel, sein Erbe.
  78: Und er weidete sie nach der Unschuld seines Herzens und leitete sie mit kundiger
    Hand.
  79: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  80: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
