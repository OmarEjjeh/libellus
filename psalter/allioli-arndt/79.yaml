# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 79
verses:
  1: O Herrscher Israels! merke auf, der du Joseph führst wie ein Schäflein;
  2: der du über den Cherubim thronst, offenbare dich vor Ephraim, Benjamin und Manasse.
  3: Erwecke deine Macht und komm, uns zu retten.
  4: O Gott! stelle uns wieder her und zeige dein Angesicht, so wird uns Heil werden.
  5: Herr, Gott der Heerscharen! wie lange willst du zürnen bei dem Gebete deines
    Dieners?
  6: Wie lange speisest du uns mit Tränenbrot und tränkst uns mit Tränentrank in reichem
    Maße?
  7: Du machst uns zum Zankapfel für unsere Nachbarn und unsere Feinde treiben ihren
    Spott mit uns.
  8: O Gott der Heerscharen! stelle uns wieder her und zeige dein Angesicht, so wird
    uns Heil zuteil.
  9: Einen Weinstock hobst du aus Ägypten aus, vertriebst die Völker und pflanztest
    ihn ein.
  10: Du warst sein Führer auf der Reise vor ihm her, pflanztest seine Wurzeln und
    er erfüllte das Land.
  11: Er bedeckte die Berge mit seinem Schatten und mit seinen Ranken die Zedern Gottes.
  12: Er breitete seine Reben aus bis ans Meer und bis an den Strom seine Sprossen.
  13: Warum hast du seine Mauer zerstört, dass alle von ihm lesen, die des Weges ziehen?
  14: Der Eber aus dem Walde zerwühlt ihn, das Wild der Wüste weidet ihn ab.
  15: O Gott der Heerscharen! kehre doch wieder, blicke vom Himmel und schaue und
    suche diesen Weinberg heim
  16: und stelle ihn wieder her, den deine Rechte gepflanzt, und schaue auf den Menschensohn,
    den du dir auferzogen hast.
  17: Er ist mit Feuer verbrannt und unterwühlt. Vor dem Dräuen deines Angesichts
    werden sie vergehen.
  18: Deine Hand sei über dem Manne deiner Rechten, über dem Menschensohne, den du
    dir auferzogen hast!
  19: Dann weichen wir nicht von dir, du wirst uns beleben; so wollen wir deinen Namen
    anrufen.
  20: O Herr, Gott der Heerscharen! stelle uns wieder her, zeige dein Angesicht, so
    wird uns Heil werden.
  21: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  22: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
