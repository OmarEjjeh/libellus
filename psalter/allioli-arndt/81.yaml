# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 81
verses:
  1: Gott steht da mitten in der Versammlung der Götter, inmitten der Götter hält
    er Gericht.
  2: Wie lange wollt ihr ungerecht richten und auf die Person der Sünder Rücksicht
    nehmen?
  3: Schaffet dem Dürftigen und dem Waisen Recht, verhelfet dem Niedrigen und Armen
    zum Rechte!
  4: Rettet den Armen und befreiet den Dürftigen aus der Hand des Sünders.
  5: Sie sind ohne Einsicht und ohne Verstand, im Finstern gehen sie einher, es wanken
    alle Grundfesten der Erde.
  6: 'Ich sprach: Ihr seid zwar Götter und insgesamt Söhne des Höchsten,'
  7: aber wie Menschen werdet ihr sterben und wie der Fürsten einer fallen.
  8: Erhebe dich, o Gott! richte die Erde, denn du bist immerdar Herr über alle Völker.
  9: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  10: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
