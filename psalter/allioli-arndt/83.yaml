# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 83
verses:
  1: Wie lieblich sind deine Wohnungen, o Herr der Heerscharen! Meine Seele sehnt
    sich und schmachtet nach den Vorhöfen des Herrn.
  2: Mein Herz und mein Leib jubeln dem lebendigen Gott zu.
  3: Denn der Sperling findet für sich ein Haus und die Turteltaube ein Nest, in das
    sie ihre Jungen lege.
  4: Deine Altäre, Herr der Heerscharen, mein König und mein Gott!
  5: Glückselig, die in deinem Hause wohnen, o Herr! allezeit loben sie dich.
  6: Glückselig der Mann, der von dir seine Hilfe erwartet! er hat in seinem Herzen
    sich Wege gebahnt im Tränentale hin zu dem Orte, den Gott gesetzt.
  7: Denn Segen verleiht der Gesetzgeber, man geht von Kraft zu Kraft; auf Sion wird
    der höchste Gott geschaut.
  8: O Herr, Gott der Heerscharen! höre auf mein Gebet; vernimm es, Gott Jakobs!
  9: O blicke herab, Gott, unser Beschirmer! und schaue auf das Angesicht deines Gesalbten,
  10: denn besser ist ein Tag in deinen Vorhöfen als sonst tausend.
  11: Lieber will ich der Geringste im Hause meines Gottes sein als in den Hütten
    der Sünder wohnen.
  12: Denn Gott liebt Erbarmen und Wahrhaftigkeit, Gnade und Herrlichkeit verleiht
    der Herr.
  13: Nicht versagt er Gutes denen, die unsträflich wandeln; Herr der Heerscharen!
    glückselig ist der Mensch, der auf dich vertraut!
  14: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  15: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
