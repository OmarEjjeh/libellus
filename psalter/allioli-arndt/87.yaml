# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 87
verses:
  1: Herr, du Gott meines Heiles! am Tage rufe ich und nachts vor dir.
  2: O lass mein Gebet vor dich kommen, neige dein Ohr meinem Flehen!
  3: Denn meine Seele ist mit Leiden erfüllt und mein Leben ist der Unterwelt nahe
    gekommen.
  4: Ich bin denen gleich geachtet, die in das Grab sinken, bin geworden wie ein Mensch
    ohne Kraft, unter die Toten entlassen,
  5: wie die Erschlagenen, die in den Gräbern ruhen, deren du nicht mehr gedenkst
    und die von deiner Hand verstoßen sind.
  6: Sie senkten mich in die tiefste Grube, in Finsternis und in Todesschatten.
  7: Auf mir ruht schwer dein Grimm und alle deine Wogen führst du über mich dahin.
  8: Du hast meine Bekannten von mir entfernt, sie machten mich zu einem Abscheu für
    sich.
  9: Ich bin preisgegeben und finde keinen Ausweg, meine Augen verschmachten vor Not.
  10: Ich rufe zu dir, o Herr! jeden Tag, ich breite nach dir meine Hände aus.
  11: Wirst du an Toten Wunder tun oder werden Ärzte sie auferwecken, dass jene dich
    dann preisen?
  12: Erzählt man im Grabe deine Gnade und deine Treue im Verderben?
  13: Werden in der Finsternis deine Wunder kund und deine Gerechtigkeit im Lande
    der Verwesung?
  14: Dennoch, o Herr! schreie ich zu dir und in der Frühe kommt mein Gebet vor dich.
  15: Warum, Herr! weisest du mein Gebet zurück, wendest dein Angesicht von mir ab?
  16: Arm bin ich und in Mühen von meiner Jugend an; erhob ich mich, so ward ich gedemütigt
    und erschreckt.
  17: Deine Zornesgluten ergingen über mich und deine Schrecken verwirrten mich.
  18: Sie haben mich umgeben wie Wasser den ganzen Tag, mich umringt allzumal.
  19: Du hast von mir den Freund und den Nächsten entfernt und meine Bekannten von
    mir im Unglück.
  20: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  21: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
