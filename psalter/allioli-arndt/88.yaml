# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 88
verses:
  1: Die Erbarmungen des Herrn will ich ewig besingen.
  2: Von Geschlecht zu Geschlecht deine Wahrheit verkünden mit meinem Munde.
  3: 'Denn du sprachst: Auf ewig soll Erbarmen aufgebaut sein im Himmel, daselbst
    ist die Treue gegen dich gefestigt.'
  4: 'Ich habe mit meinen Auserwählten einen Bund geschlossen, habe David, meinem
    Diener, geschworen: Auf ewig will ich deine Nachkommenschaft fest gegründet sein
    lassen.'
  5: Und von Geschlecht zu Geschlecht deinen Thron erbauen.
  6: Die Himmel preisen deine Wunder, o Herr! und deine Treue in der Versammlung der
    Heiligen.
  7: Denn wer in den Wolken gleicht dem Herrn, ist Gott ähnlich unter den Gottessöhnen?
  8: Gott, der verherrlicht wird im Rate der Heiligen, ist groß und furchtbar, mehr
    als alle, die um ihn her sind.
  9: Herr, Gott der Heerscharen! wer ist dir gleich? Mächtig bist du, o Herr! und
    deine Treue umgibt dich.
  10: Du herrschest über den Ungestüm des Meeres und stillst den Aufruhr seiner Wogen.
  11: Du beugst den Hochmütigen gleich einem Verwundeten, mit deinem starken Arme
    zerstreust du deine Feinde.
  12: Dein sind die Himmel und dein ist die Erde, den Erdkreis und was ihn erfüllt,
    hast du gegründet; Norden und Südmeer hast du geschaffen.
  13: Thabor und Hermon jubeln über deinen Namen. Dein Arm ist voller Kraft.
  14: Lass deine Hand stark werden und deine Rechte sich erheben. Gerechtigkeit und
    Recht sind die Grundlage deines Thrones.
  15: Erbarmen und Wahrhaftigkeit gehen vor deinem Antlitze her. Glückselig das Volk,
    das Lobpreisung kennt.
  16: Herr! Im Lichte deines Angesichtes werden sie wandeln und über deinen Namen
    frohlocken allezeit und durch deine Gerechtigkeit erhöht werden.
  17: Denn du bist der Ruhm ihrer Kraft und durch dein Wohlgefallen wird unser Horn
    erhöht.
  18: Denn der Herr ist unser Schutz und der Heilige Israels der Schutz unseres Königs.
  19: 'Damals redetest du im Gesichte zu deinen Heiligen und sprachest: Ich gewähre
    einem Helden Beistand und erhöhe ihn als Auserwählten aus meinem Volke.'
  20: Ich habe David als meinen Diener erfunden, mit meinem heiligen Öl ihn gesalbt.
  21: Denn meine Hand soll ihm hilfreich sein und mein Arm ihn stärken.
  22: Nichts soll der Feind über ihn vermögen und der Sohn der Ruchlosigkeit ihm nicht
    weiter schaden.
  23: Ich will seine Feinde vor seinem Angesichte zermalmen und, die ihn hassen, in
    die Flucht schlagen.
  24: Meine Treue und mein Erbarmen soll mit ihm sein und in meinem Namen soll sein
    Horn erhöht werden.
  25: Ich will seiner Hand das Meer unterwerfen und die Ströme seiner Rechten.
  26: 'Er wird zu mir rufen: Mein Vater, mein Gott und die Zuflucht meines Heils bist
    du!'
  27: Und ich, ich will ihn zum Erstgebornen machen, zum Höchsten unter den Königen
    der Erde.
  28: Ewig will ich ihm meine Barmherzigkeit bewahren und treu meinen Bund.
  29: Ich will seine Nachkommenschaft dauern lassen auf ewig und seinen Thron gleich
    den Tagen des Himmels.
  30: Doch wenn seine Söhne mein Gesetz verlassen und nicht nach meinen Rechten wandeln,
  31: wenn sie meine Satzungen entheiligen und meine Gebote nicht halten,
  32: so werde ich mit der Rute ihre Vergehungen heimsuchen und mit Schlägen ihre
    Sünden.
  33: Doch meine Gnade will ich ihm nicht entziehen noch es fehlen lassen an meiner
    Treue;
  34: noch will ich meinen Bund entweihen noch zunichte machen, was über meine Lippen
    gegangen ist.
  35: Einmal habe ich bei meiner Heiligkeit geschworen, ich werde David nicht lügen.
    Seine Nachkommenschaft soll ewig dauern.
  36: und sein Thron gleich der Sonne vor meinem Angesichte, und gleich dem Monde,
    der gegründet ist auf ewig, und der Zeuge im Himmel ist getreu!
  37: Und doch hast du verworfen und verschmäht, verworfen deinen Gesalbten,
  38: hast den Bund deines Dieners aufgehoben, entweiht zur Erde sein Heiligtum,
  39: hast alle seine Zäune niedergerissen, seine Feste zum Gegenstand des Schreckens
    gemacht.
  40: Es beraubten ihn alle, die des Weges vorüberzogen; er ward zum Hohne für seine
    Nachbarn.
  41: Du hast die Rechte seiner Unterdrücker erhöht, hast alle seine Feinde frohlocken
    lassen.
  42: Du hast die Hilfe seines Schwertes von ihm gewendet und ihm nicht im Kriege
    beigestanden.
  43: Du hast ihn seines Glanzes beraubt und seinen Thron zur Erde gestürzt,
  44: du hast die Tage seiner Zeit abgekürzt, hast ihn mit Schmach bedeckt.
  45: Wie lange noch, o Herr! wendest du dich so ganz ab, entbrennt dein Zorn wie
    Feuer?
  46: Gedenke, welches meine Lebensdauer ist! Hast du denn alle Menschenkinder vergebens
    erschaffen?
  47: Wo ist der Mensch, der lebte und den Tod nicht schaute, der seine Seele vor
    der Gewalt der Unterwelt bewahren könnte?
  48: Wo sind deine früheren Gnaden, o Herr! wie du David in deiner Treue geschworen?
  49: Gedenke, o Herr! der Schmach deiner Diener, (die ich in meinem Busen trage,)
    von so vielen Völkern her,
  50: mit der deine Feinde, Herr! schmähen, mit der sie die Veränderung deines Gesalbten
    schmähen.
  51: Gepriesen sei der Herr in Ewigkeit! Amen, Amen!
  52: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  53: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
