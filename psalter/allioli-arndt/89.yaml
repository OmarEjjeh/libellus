# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 89
verses:
  1: O Herr! du bist unsere Zuflucht gewesen von Geschlecht zu Geschlecht.
  2: Ehedenn die Berge wurden und die Erde gebildet ward und ihr Umkreis, bist du,
    Gott! von Ewigkeit zu Ewigkeit.
  3: 'Verstoße den Menschen nicht zur Niedrigkeit, du, der ja gesagt: Bekehret euch,
    ihr Menschenkinder!'
  4: Denn tausend Jahre sind in deinen Augen wie der gestrige Tag, der vorübergegangen
    ist.
  5: Und wie eine Wache in der Nacht. Was für nichts vor ihnen geachtet wird, das
    sind Jahre.
  6: Wie das Gras am Morgen hervorwächst, am Morgen blüht, um abzusterben, am Abend
    abwelkt, hart wird und verdorrt,
  7: So schwinden wir dahin durch deinen Zorn und sind verstört durch deinen Grimm.
  8: Du stellst unsere Missetaten vor deine Augen, die Zeit unseres Lebens in das
    Licht deines Angesichtes.
  9: Denn alle unsere Tage schwinden dahin, wir vergehen durch deinen Zorn.
  10: Unsere Jahre mühen sich ab wie eine Spinne; die Zeit unserer Jahre ist siebzig
    Jahre.
  11: Und aufs höchste achtzig Jahre und was darüber hinaus ist, ist Mühsal und Schmerz.
  12: Denn die Milde kommt und wir werden hingerafft.
  13: Wer kann die Stärke deines Zornes und aus Furcht vor dir deinen Grimm bemessen?
  14: So gib denn so deine Macht kund und lass unser Herz in der Weisheit belehrt
    werden.
  15: Kehre wieder, Herr! Wie lange noch? Lass dich erbitten über deine Diener!
  16: So werden wir am Morgen deine Gnade reichlich empfangen und frohlocken und uns
    alle unsere Tage freuen.
  17: Wir werden uns freuen nach Maß der Tage, in denen du uns gebeugt hast, der Jahre,
    in denen wir Unglück sahen.
  18: Siehe auf deine Diener herab und auf deine Werke und lenke ihre Kinder!
  19: Und der Glanz des Herrn, unsers Gottes, leuchte über uns und die Werke unserer
    Hände fördere über uns, ja das Werk unserer Hände wollest du fördern!
  20: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  21: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
