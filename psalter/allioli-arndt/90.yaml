# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 90
verses:
  1: Wer unter der Hilfe des Allerhöchsten wohnt, weilt unter dem Schirme des Gottes
    des Himmels.
  2: 'Er kann zu dem Herrn sagen: Du bist mein Helfer und meine Zuflucht, mein Gott,
    auf den ich vertraue.'
  3: Denn er befreit mich aus der Schlinge der Vogelsteller, und von Ungemach.
  4: Mit seinen Schultern wird er dich decken und unter seinen Flügeln wirst du Hoffnung
    schöpfen.
  5: Mit einem Schild wird dich seine Treue umgeben; vor den Schrecken der Nacht darfst
    du dich nicht fürchten,
  6: nicht vor dem Pfeile, der bei Tage fliegt, vor dem Unheil, das im Finstern wandelt,
    vor dem Überfalle und dem bösen Geiste am Mittag.
  7: Fallen auch tausend an deiner Seite und zehntausend zu deiner Rechten, so wird
    es doch dir nicht nahen.
  8: Ja, mit eigenen Augen wirst du es schauen und die Vergeltung an den Sündern sehen.
  9: Denn du, o Herr! bist meine Hoffnung, den Allerhöchsten hast du zu deiner Zuflucht
    gemacht.
  10: Kein Unheil wird dir begegnen und keine Plage deinem Zelte nahen.
  11: Denn er hat seinen Engeln für dich geboten, dass sie dich auf allen deinen Wegen
    behüten.
  12: Auf den Händen werden sie dich tragen, dass du deinen Fuß nicht an einen Stein
    stoßest.
  13: Über Nattern und Ottern wirst du hinschreiten und Löwen und Drachen zertreten.
  14: Weil er auf mich vertraut, so will ich ihn befreien; ihn beschirmen, weil er
    meinen Namen kennt.
  15: 'Er wird mich anrufen und ich werde ihn erhören, ich bin bei ihm in der Not,
    ich werde ihn retten und ihn zu Ehren bringen:'
  16: Mit langem Leben will ich ihn sättigen und ihn mein Heil schauen lassen.
  17: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  18: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
