# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
psalmus: 91
verses:
  1: Gut ist es, den Herrn zu preisen und Lob zu singen deinem Namen, du Höchster!
  2: Am frühen Morgen deine Barmherzigkeit zu verkünden und deine Treue des Nachts,
  3: mit zehnsaitigem Spiele, mit der Harfe, mit Jubellied zur Zither.
  4: Denn du erfreuest mich, Herr! durch dein Tun, über die Werke deiner Hände will
    ich jubeln.
  5: Wie herrlich sind deine Werke, o Herr! Sehr tief sind deine Gedanken!
  6: Ein unverständiger Mensch erkennt dies nicht und ein Tor versteht dies nicht.
  7: Wenn die Sünder gleich dem Grase aufsprossen und alle Übeltäter aufblühen.
  8: So ist es, damit sie vertilgt werden auf ewig. Du aber bist der Höchste in Ewigkeit,
    o Herr!
  9: Denn siehe, deine Feinde, o Herr! denn siehe, deine Feinde kommen um, und zerstreut
    werden alle, die Böses tun.
  10: Doch mein Horn wird erhöht wie das des Einhorns und mein Alter wird großes Erbarmen
    genießen.
  11: Und mein Auge wird herabschauen auf meine Feinde und an meinen boshaften Widersachern
    wird sich mein Ohr letzen.
  12: Der Gerechte wird blühen gleich der Palme, gleich der Zeder des Libanon gedeihen.
  13: Im Hause des Herrn gepflanzt, werden sie blühen in den Vorhöfen des Hauses unsers
    Gottes.
  14: Noch im späten Alter werden sie gedeihen und frisch sein,
  15: um zu verkünden, dass der Herr, unser Gott, gerecht und kein Unrecht an ihm
    ist.
  16: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  17: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
