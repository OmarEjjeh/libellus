# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Psalters ausgerichtet und dort, wo Allioli-Verse
# und gesungene Verse nicht 1:1 uebereinstimmten, in einem zweiten Durchgang
# von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut unveraendert, nur
# die Versgrenze verschoben. Weiterhin PRIESTER-REVIEW ausstehend.
# STANDARD-PSALTER SEIT ADR-0041, ABER NOCH NICHT ABGENOMMEN: die Durchsicht
# durch den Pastor steht aus, und der Urheberrechtsstatus dieser konkreten
# Digitalisierung ist nicht bestaetigt (Issue #1). Gefundene Fehler werden als
# eigene Korrektur nachgezogen. Ein Heft, das eine geprueft Uebersetzung
# braucht, setzt "psalter_de:" ausdruecklich - so wie die beiden Hefte in
# feasts/, die weiter die Einheitsuebersetzung verwenden.
psalmus: 94
verses:
  1: Kommet, lasset uns dem Herrn frohlocken, Gott jubeln, unserm Retter!
  2: Lasset uns früh mit Lobpreis vor sein Angesicht treten und mit Gesängen ihm zujauchzen!
  3: Denn ein großer Gott ist der Herr und ein großer König über alle Götter.
  4: Denn in seiner Hand sind alle Grenzen der Erde und der Berge Höhen sind sein.
  5: Sein ist das Meer, denn er hat es geschaffen, und das feste Land haben seine
    Hände gebildet.
  6: Kommet, lasset uns anbetend niederfallen und lasset uns weinen vor dem Herrn,
    der uns erschaffen hat!
  7: Denn er ist der Herr, unser Gott, und wir sind das Volk seiner Weide und die
    Schäflein seiner Leitung.
  8: Heute, da ihr seine Stimme hört, verhärtet eure Herzen nicht,
  9: wie bei der Reizung am Tage der Versuchung in der Wüste, wo mich eure Väter versuchten,
    mich auf die Probe stellten, und doch hatten sie meine Werke gesehen.
  10: 'Vierzig Jahre hatte ich Verdruss an diesem Geschlechte und sprach: Stets irren
    sie im Herzen!'
  11: 'Sie haben meine Wege nicht erkannt, so schwur ich in meinem Zorne: Wahrlich,
    nicht sollen sie in meine Ruhe gelangen.'
  12: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  13: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
