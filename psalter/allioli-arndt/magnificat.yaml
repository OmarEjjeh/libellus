# Allioli-Arndt 1914, aus k-bibel.de's Bibel-App-Datenquelle bezogen, auf die
# Versgrenzen des gesungenen Magnificat ausgerichtet und in einem zweiten
# Durchgang von Hand (Editor-KI) neu aufgeteilt (Issue #1) - Wortlaut
# unveraendert, nur die Versgrenze verschoben. PRIESTER-REVIEW ausstehend.
# UNGEPRUEFT: Der Urheberrechtsstatus dieser konkreten Digitalisierung ist
# noch nicht bestaetigt (siehe Issue #1) - nicht als Standard-Psalter
# einbinden, bevor das geklaert ist.
canticum: magnificat
verses:
  1: Hoch preiset meine Seele den Herrn,
  2: und mein Geist frohlocket in Gott, meinem Heilande!
  3: Weil er die Niedrigkeit seiner Magd angesehen hat; denn siehe, von nun an werden
    mich selig preisen alle Geschlechter.
  4: Denn Großes hat an mir getan, der mächtig, und dessen Name heilig ist!
  5: Und seine Barmherzigkeit währet von Geschlecht zu Geschlecht bei denen, die ihn
    fürchten.
  6: Er hat Macht geübt mit seinem Arme, zerstreuet, die da hoffärtig sind in ihres
    Herzens Sinne.
  7: Er hat Gewaltige vom Throne gestürzt, und Niedrige hat er erhöhet.
  8: Hungrige hat er mit Gütern erfüllt, und die Reichen leer ausgehen lassen.
  9: Er hat sich Israels, seines Knechtes, angenommen, eingedenk seiner Barmherzigkeit;
  10: wie er zu unsern Vätern gesprochen hat, zu Abraham und seinen Nachkommen in
    Ewigkeit.
  11: Ehre sei dem Vater und dem Sohn und dem Heiligen Geist.
  12: Wie im Anfang, so auch jetzt und allezeit und in Ewigkeit. Amen.
