# German texts of the ordinary chants (printed beneath their scores).
# Keys = gabc file names in this folder, without the .gabc suffix.
incipit: >-
  ℣. O Gott, komm mir zu Hilfe. ℟. Herr, eile mir zu helfen. — Ehre sei dem
  Vater und dem Sohn und dem Heiligen Geist. Wie im Anfang, so auch jetzt und
  allezeit und in Ewigkeit. Amen. — Halleluja.
te-rogamus: ℟. Wir bitten dich, erhöre uns.
paternoster: >-
  Vater unser im Himmel, geheiligt werde dein Name. Dein Reich komme. Dein
  Wille geschehe, wie im Himmel so auf Erden. Unser tägliches Brot gib uns
  heute. Und vergib uns unsere Schuld, wie auch wir vergeben unsern
  Schuldigern. Und führe uns nicht in Versuchung, sondern erlöse uns von dem
  Bösen.
versicle-domine-exaudi: ℣. Herr, erhöre mein Gebet. ℟. Und mein Rufen komme zu dir.
dominus-vobiscum: ℣. Der Herr sei mit euch. ℟. Und mit deinem Geiste.
# One German text for every melody of the Benedicamus by rank (ADR-0054).
benedicamus-domino: &benedicamus ℣. Lasset uns den Herrn loben.
benedicamus-domino-i-classis-i-vesperae: *benedicamus
benedicamus-domino-ii-classis-i-vesperae: *benedicamus
benedicamus-domino-ii-classis-ii-vesperae: *benedicamus
benedicamus-domino-iii-classis: *benedicamus
deo-gratias: &deo-gratias ℟. Dank sei Gott.
deo-gratias-i-classis-i-vesperae: *deo-gratias
deo-gratias-ii-classis-i-vesperae: *deo-gratias
deo-gratias-ii-classis-ii-vesperae: *deo-gratias
deo-gratias-iii-classis: *deo-gratias
# Wortlaut des Pastors, 2026-07-31 (Anmerkung zu S. 31): "(verstorbenen)" macht
# klar, dass "fideles" hier die Verstorbenen sind und nicht die Anwesenden.
fidelium-animae: >-
  Die Seelen der (verstorbenen) Gläubigen mögen durch die Barmherzigkeit
  Gottes ruhen in Frieden.
salve-regina-simple: >-
  Sei gegrüßt, Königin, Mutter der Barmherzigkeit, unser Leben, unsere Wonne
  und unsere Hoffnung, sei gegrüßt! Zu dir rufen wir verbannte Kinder Evas.
  Zu dir seufzen wir trauernd und weinend in diesem Tränenland. Wohlan denn,
  unsere Fürsprecherin, wende deine barmherzigen Augen uns zu, und nach
  diesem Elend zeige uns Jesus, die gebenedeite Frucht deines Leibes.
  O gütige, o milde, o süße Jungfrau Maria!
reginacaeli: >-
  Freu dich, du Himmelskönigin, Halleluja! Den du zu tragen würdig warst,
  Halleluja, er ist erstanden, wie er gesagt hat, Halleluja. Bitt Gott für
  uns, Halleluja.
