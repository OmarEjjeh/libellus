# Vulgate psalm number → canonical accented Latin incipit (ADR-0010).
# The single source of truth for every consumer that names a psalm: the
# Ordo table, the form's psalm combobox (#28), the incipit-filling agent
# skill (#29). Hand-correctable — nothing regenerates this file.
#
# Generated once, 2026-07-30, from the vendored accented Clementine
# psalter (scripts/psalm-library/vendor/psalms/, byte-for-byte from
# jgabc, public domain): the first verse's opening words, extended past
# a governing word or a stranded form of *esse* the same way chant
# incipits are (ADR-0020), then extended to at most three words where
# that separates two psalms.
#
# Incipits are NOT unique, and cannot be made so: Ps 6/37, 13/52 and
# 106/117 open with word-for-word identical verses. The psalm number is
# the identifier; the incipit is a label that accompanies it.
# 15 groups (35 psalms) share a label — listed at the foot of this file.
#
# Two labels count as shared when they differ only by punctuation or case:
# the psalter punctuates the same words inconsistently (Ps 105 "Confitémini
# Dómino, quóniam bonus" against Ps 106 without the comma; likewise Ps 102
# against 103, and Ps 50 against 55/56). A comma is not a distinction a
# reader could use, so it must not let a psalm pass for uniquely named.
# The stored text itself stays faithful to the psalter, commas and all.

