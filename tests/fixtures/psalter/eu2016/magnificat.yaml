# Stand-in for the pinned "eu2016" translation — KEIN liturgischer Text.
#
# The Benedict fixture pins `psalter_de: eu2016`, because that is what its
# printed booklet was set from. The real Einheitsübersetzung is not
# redistributable, so the suite resolves that pin against this synthetic
# stand-in of the same name instead (ADR-0024). Same shape, same verse counts,
# invented words.
